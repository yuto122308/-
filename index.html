<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>既読 — フィルターバブル体験ゲーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       グローバルリセット・基本スタイル
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
      color: #fff;
      padding: 30px 0;
    }

    /* ============================================
       スマホ画面モック本体 (390px)
    ============================================ */
    #phone {
      width: 390px;
      min-height: 700px;
      background: #1a1a1a;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 0 2px #2a2a2a,
        0 0 80px rgba(80, 80, 80, 0.2);
      position: relative;
    }

    /* ============================================
       ステータスバー
    ============================================ */
    #status-bar {
      background: #111;
      padding: 12px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #888;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    #day-label {
      font-weight: 700;
      color: #aaa;
      font-size: 12px;
    }

    /* ============================================
       メインコンテンツエリア
    ============================================ */
    #screen {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #screen::-webkit-scrollbar {
      width: 3px;
    }
    #screen::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    /* ============================================
       アニメーション
    ============================================ */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease both;
    }

    /* ============================================
       タイトル画面
    ============================================ */
    .title-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 620px;
      text-align: center;
      animation: fadeIn 0.8s ease both;
    }

    .title-logo {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 12px;
      color: #fff;
      margin-bottom: 8px;
    }

    .title-subtitle {
      font-size: 13px;
      color: #555;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .title-desc {
      font-size: 13px;
      color: #777;
      line-height: 1.8;
      margin-bottom: 50px;
      max-width: 280px;
    }

    /* ============================================
       ボタン類
    ============================================ */
    .btn-primary {
      background: #fff;
      color: #0d0d0d;
      border: none;
      padding: 14px 40px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 2px;
    }

    .btn-primary:hover {
      background: #ddd;
      transform: scale(1.03);
    }

    .btn-choice {
      background: #222;
      color: #eee;
      border: 1px solid #333;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      line-height: 1.5;
      width: 100%;
    }

    .btn-choice:hover {
      background: #2a2a2a;
      border-color: #555;
      transform: translateX(3px);
    }

    .btn-choice.saki-choice {
      border-left: 3px solid #c0392b;
    }

    .btn-choice.ren-choice {
      border-left: 3px solid #2980b9;
    }

    .btn-choice.neutral-choice {
      border-left: 3px solid #27ae60;
    }

    .btn-next {
      background: #222;
      color: #888;
      border: 1px solid #333;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      align-self: center;
      margin-top: 8px;
    }

    .btn-next:hover {
      background: #2a2a2a;
      color: #ccc;
    }

    /* ============================================
       セクションヘッダー
    ============================================ */
    .section-header {
      background: #111;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px;
      color: #666;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeIn 0.4s ease both;
    }

    /* ============================================
       ナレーションテキスト
    ============================================ */
    .narration {
      font-size: 13px;
      color: #aaa;
      line-height: 1.9;
      padding: 4px 2px;
      animation: fadeIn 0.5s ease both;
    }

    .narration-emphasis {
      color: #ddd;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.9;
      padding: 4px 2px;
      animation: fadeIn 0.5s ease both;
    }

    /* ============================================
       キャラクターアイコン
    ============================================ */
    .char-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .icon-saki { background: #c0392b; }
    .icon-ren  { background: #2980b9; }
    .icon-hana { background: #8e44ad; }
    .icon-yu   { background: #2d5a27; }

    /* ============================================
       会話バブル（学校シーン）
    ============================================ */
    .dialogue-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: slideIn 0.4s ease both;
    }

    .dialogue-row.player-row {
      flex-direction: row-reverse;
    }

    .bubble {
      background: #252525;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.7;
      color: #e0e0e0;
      max-width: 240px;
    }

    .bubble.player-bubble {
      background: #2d5a27;
      color: #fff;
    }

    .dialogue-name {
      font-size: 10px;
      color: #666;
      margin-bottom: 4px;
    }

    /* ============================================
       SNSタイムライン
    ============================================ */
    .sns-header {
      background: #111;
      border-radius: 10px 10px 0 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #222;
    }

    .sns-app-name {
      font-size: 14px;
      font-weight: 700;
      color: #ccc;
    }

    .sns-post {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 14px;
      animation: fadeIn 0.5s ease both;
      border: 1px solid #252525;
    }

    .sns-post-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sns-post-meta {
      display: flex;
      flex-direction: column;
    }

    .sns-post-name {
      font-size: 13px;
      font-weight: 700;
      color: #ccc;
    }

    .sns-post-time {
      font-size: 10px;
      color: #555;
    }

    .sns-post-text {
      font-size: 13px;
      color: #bbb;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .sns-post-actions {
      display: flex;
      gap: 8px;
    }

    .btn-like {
      background: #222;
      color: #888;
      border: 1px solid #333;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }

    .btn-like:hover {
      background: #2a2a2a;
      color: #ddd;
    }

    .btn-like.liked {
      background: #c0392b;
      color: #fff;
      border-color: #c0392b;
    }

    .btn-skip {
      background: transparent;
      color: #555;
      border: 1px solid #282828;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 11px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-skip:hover {
      color: #888;
      border-color: #444;
    }

    /* ============================================
       DMスクリーン (LINE風)
    ============================================ */
    .dm-header {
      background: #111;
      border-radius: 12px 12px 0 0;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e1e1e;
    }

    .dm-partner-name {
      font-size: 14px;
      font-weight: 700;
      color: #ccc;
    }

    .dm-body {
      background: #111;
      border-radius: 0 0 12px 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dm-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: fadeIn 0.4s ease both;
    }

    .dm-row.dm-player-row {
      flex-direction: row-reverse;
    }

    .dm-bubble {
      background: #222;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #ddd;
      max-width: 220px;
    }

    .dm-bubble.dm-player-bubble {
      background: #2d5a27;
      color: #fff;
    }

    .dm-time {
      font-size: 10px;
      color: #444;
    }

    .kidoku-label {
      font-size: 10px;
      color: #555;
      text-align: right;
      margin-top: -4px;
      animation: fadeIn 0.3s ease 0.8s both;
    }

    .kidoku-label.read {
      color: #2980b9;
    }

    /* ============================================
       Day4 分割スクリーン
    ============================================ */
    .split-screen {
      display: flex;
      gap: 8px;
      animation: fadeIn 0.6s ease both;
    }

    .split-panel {
      flex: 1;
      border-radius: 12px;
      padding: 12px;
      min-height: 180px;
    }

    .split-panel.saki-panel {
      background: rgba(192, 57, 43, 0.15);
      border: 1px solid rgba(192, 57, 43, 0.3);
      animation: slideInLeft 0.5s ease both;
    }

    .split-panel.ren-panel {
      background: rgba(41, 128, 185, 0.15);
      border: 1px solid rgba(41, 128, 185, 0.3);
      animation: slideInRight 0.5s ease both;
    }

    .split-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .split-label.saki-label { color: #c0392b; }
    .split-label.ren-label  { color: #2980b9; }

    .split-post {
      font-size: 11px;
      color: #999;
      line-height: 1.6;
      margin-bottom: 8px;
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
    }

    /* ============================================
       エンディング画面
    ============================================ */
    .ending-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding: 20px 4px;
      animation: fadeIn 0.8s ease both;
    }

    .ending-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .ending-subtitle {
      font-size: 13px;
      color: #666;
      letter-spacing: 2px;
    }

    .ending-body {
      font-size: 13px;
      color: #aaa;
      line-height: 1.9;
      text-align: left;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #252525;
    }

    /* ============================================
       バイアス可視化グラフ
    ============================================ */
    .bias-section {
      animation: fadeIn 0.6s ease both;
    }

    .bias-title {
      font-size: 14px;
      font-weight: 700;
      color: #ccc;
      margin-bottom: 12px;
      text-align: center;
    }

    .bias-bar-row {
      margin-bottom: 16px;
    }

    .bias-bar-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .bias-bar-bg {
      background: #222;
      border-radius: 4px;
      height: 12px;
      overflow: hidden;
    }

    .bias-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1.2s ease;
    }

    .fill-saki  { background: linear-gradient(90deg, #c0392b, #e74c3c); }
    .fill-ren   { background: linear-gradient(90deg, #2980b9, #3498db); }
    .fill-neutral { background: linear-gradient(90deg, #27ae60, #2ecc71); }

    .bias-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.8;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #222;
    }

    /* ============================================
       選択肢エリア
    ============================================ */
    .choices-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.5s ease both;
    }

    .choices-label {
      font-size: 11px;
      color: #555;
      text-align: center;
      letter-spacing: 1px;
    }

    /* ============================================
       デイ区切りカード
    ============================================ */
    .day-card {
      background: #111;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      animation: fadeIn 0.6s ease both;
    }

    .day-card-num {
      font-size: 11px;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .day-card-title {
      font-size: 20px;
      font-weight: 700;
      color: #ccc;
      letter-spacing: 2px;
    }

    .day-card-sub {
      font-size: 12px;
      color: #444;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="phone">
    <div id="status-bar">
      <span id="day-label">— 既読 —</span>
      <span>🔋</span>
    </div>
    <div id="screen"></div>
  </div>

  <script>
    // ============================================
    // スコアシステム（非表示）
    // ============================================
    let scores = { saki: 0, ren: 0, neutral: 0 };
    let currentDay = 0;
    let day4Choice = null;
    let finalChoice = null;

    // ============================================
    // ユーティリティ
    // ============================================
    const gameScreen = document.getElementById('screen');
    const dayLabel = document.getElementById('day-label');

    function setDayLabel(text) {
      dayLabel.textContent = text;
    }

    function clearScreen() {
      gameScreen.innerHTML = '';
    }

    function scrollToBottom() {
      setTimeout(() => gameScreen.scrollTop = gameScreen.scrollHeight, 50);
    }

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html) e.innerHTML = html;
      return e;
    }

    function append(node) {
      gameScreen.appendChild(node);
      scrollToBottom();
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // キャラクターアイコンHTML生成
    function iconHtml(who) {
      const map = {
        saki: ['icon-saki', '咲'],
        ren:  ['icon-ren',  '蓮'],
        hana: ['icon-hana', 'H'],
        yu:   ['icon-yu',   'ユ'],
      };
      const [cls, char] = map[who] || ['icon-yu', '?'];
      return `<div class="char-icon ${cls}">${char}</div>`;
    }

    // 会話バブル追加
    function addDialogue(who, name, text) {
      const isPlayer = (who === 'yu');
      const row = el('div', `dialogue-row${isPlayer ? ' player-row' : ''}`);
      const nameHtml = name ? `<div class="dialogue-name">${name}</div>` : '';
      const icon = el('div');
      icon.innerHTML = iconHtml(who);
      const bubbleWrap = el('div');
      bubbleWrap.innerHTML = `${nameHtml}<div class="bubble${isPlayer ? ' player-bubble' : ''}">${text}</div>`;
      if (isPlayer) {
        row.appendChild(bubbleWrap);
        row.appendChild(icon);
      } else {
        row.appendChild(icon);
        row.appendChild(bubbleWrap);
      }
      append(row);
    }

    // ナレーション追加
    function addNarration(text, emphasis) {
      const p = el('p', emphasis ? 'narration-emphasis' : 'narration', text);
      append(p);
    }

    // セクションヘッダー
    function addSectionHeader(text) {
      const h = el('div', 'section-header', text);
      append(h);
    }

    // ボタン追加（汎用）
    function addButton(label, cls, fn) {
      const btn = el('button', cls, label);
      btn.onclick = fn;
      append(btn);
      return btn;
    }

    // ============================================
    // タイトル画面
    // ============================================
    function showTitle() {
      clearScreen();
      setDayLabel('— 既読 —');
      const wrap = el('div', 'title-screen');
      wrap.innerHTML = `
        <div class="title-logo">既読</div>
        <div class="title-subtitle">— フィルターバブル体験ゲーム —</div>
        <div class="title-desc">
          文化祭の準備をめぐって<br>
          クラスが二分されていく。<br><br>
          あなたはどちらの声を聞き、<br>
          何を信じるのか。
        </div>
      `;
      const btn = el('button', 'btn-primary', 'はじめる');
      btn.onclick = () => showDay1School();
      wrap.appendChild(btn);
      append(wrap);
    }

    // ============================================
    // DAY 1：学校
    // ============================================
    async function showDay1School() {
      clearScreen();
      setDayLabel('Day 1 — 学校');
      currentDay = 1;

      const card = el('div', 'day-card');
      card.innerHTML = `
        <div class="day-card-num">DAY 1</div>
        <div class="day-card-title">集合写真</div>
        <div class="day-card-sub">文化祭まで3週間</div>
      `;
      append(card);

      await delay(200);
      addNarration('昼休み。クラスの文化祭準備委員会が、初めて全員集まった。');
      await delay(300);
      addDialogue('saki', '渡辺 咲', 'ねえ聞いて！　今年の出し物、私やっぱりお化け屋敷にしたいんだけど。');
      await delay(300);
      addDialogue('ren', '中島 蓮', '……カフェじゃダメなの？　去年みたいなやつ。収益も安定するし。');
      await delay(300);
      addDialogue('saki', '渡辺 咲', 'また同じのやっても面白くないじゃん！　せっかくの高校最後の文化祭なのに。');
      await delay(300);
      addDialogue('ren', '中島 蓮', '「面白い」だけで決めて後で後悔するのが嫌なんだよ。去年のこと覚えてない？');
      await delay(300);
      addNarration('去年——前の委員長が強引に進めた出し物が直前で崩れ、クラスが一時ギスギスした。蓮はそれを引きずっている。');
      await delay(200);
      addSectionHeader('あなたはどう動く？');

      await delay(100);
      const choicesArea = el('div', 'choices-area');
      choicesArea.innerHTML = '<div class="choices-label">選択してください</div>';

      const c1 = el('button', 'btn-choice saki-choice', '「お化け屋敷、やってみようよ。みんなで作るの楽しそう」');
      c1.onclick = () => { scores.saki += 2; showDay1SchoolEnd('saki'); };
      const c2 = el('button', 'btn-choice ren-choice', '「カフェのほうが現実的かもね。トラブル少なそう」');
      c2.onclick = () => { scores.ren += 2; showDay1SchoolEnd('ren'); };
      const c3 = el('button', 'btn-choice neutral-choice', '「ふたりの言いたいこと、もう少し聞かせてほしい」');
      c3.onclick = () => { scores.neutral += 4; showDay1SchoolEnd('neutral'); };

      choicesArea.appendChild(c1);
      choicesArea.appendChild(c2);
      choicesArea.appendChild(c3);
      append(choicesArea);
    }

    async function showDay1SchoolEnd(choice) {
      const area = gameScreen.querySelector('.choices-area');
      if (area) area.remove();

      if (choice === 'saki') {
        addDialogue('yu', 'ユウ', 'お化け屋敷、やってみようよ。みんなで作るの楽しそう。');
        await delay(200);
        addDialogue('saki', '渡辺 咲', 'でしょでしょ！　ユウもそう思うよね！');
        await delay(200);
        addDialogue('ren', '中島 蓮', '……まあ、多数決で決めればいいじゃん。');
      } else if (choice === 'ren') {
        addDialogue('yu', 'ユウ', 'カフェのほうが現実的かもね。トラブル少なそう。');
        await delay(200);
        addDialogue('ren', '中島 蓮', 'そうだよ。ちゃんと考えてる人もいるんだよ咲。');
        await delay(200);
        addDialogue('saki', '渡辺 咲', '……（口をつぐんだ）');
      } else {
        addDialogue('yu', 'ユウ', 'ふたりの言いたいこと、もう少し聞かせてほしい。');
        await delay(200);
        addDialogue('saki', '渡辺 咲', 'え？　……うん、いいけど。');
        await delay(200);
        addDialogue('ren', '中島 蓮', '……珍しいこと聞くね、ユウは。');
      }

    function addSNSPost(post, index) {
      const { who, name, time, text, type } = post;
      const postEl = el('div', 'sns-post');
      postEl.style.animationDelay = `${index * 0.1}s`;
      postEl.innerHTML = `
        <div class="sns-post-header">
          ${iconHtml(who)}
          <div class="sns-post-meta">
            <span class="sns-post-name">${name}</span>
            <span class="sns-post-time">${time}</span>
          </div>
        </div>
        <div class="sns-post-text">${text}</div>
        <div class="sns-post-actions">
          <button class="btn-like" data-type="${type}">♡ いいね</button>
          <button class="btn-skip">スキップ</button>
        </div>
      `;

      const likeBtn = postEl.querySelector('.btn-like');
      const skipBtn = postEl.querySelector('.btn-skip');

      likeBtn.onclick = () => {
        if (likeBtn.classList.contains('liked')) return;
        likeBtn.classList.add('liked');
        likeBtn.textContent = '♥ いいね済み';
        if (type === 'saki') scores.saki += 2;
        else if (type === 'ren') scores.ren += 2;
        else scores.neutral += 3;
        likeBtn.disabled = true;
        skipBtn.disabled = true;
      };

      skipBtn.onclick = () => {
        scores.neutral -= 1;
        likeBtn.disabled = true;
        skipBtn.disabled = true;
        postEl.style.opacity = '0.4';
      };

      append(postEl);
    }

      addNarration('対立がSNSにあふれ出していた。');

      await delay(200);

      const posts = [
        { who: 'saki', name: '渡辺 咲', time: '18:44', text: '自分のやり方だけが正しいと思ってる人、怖い。誰の文化祭なの？', type: 'saki' },
        { who: 'ren', name: '中島 蓮', time: '19:02', text: '感情で動いて失敗した時に誰かが責任取るの。最初から言ってた。', type: 'ren' },
        { who: 'hana', name: 'Hana', time: '19:45', text: 'ユウ、明日早めに来て。ちょっと話したいことある。', type: 'neutral' },
      ];

      for (let i = 0; i < posts.length; i++) {
        await delay(300 + i * 200);
        addSNSPost(posts[i], i);
      }

      await delay(500);
      addSectionHeader('あなたはどう動く？');
      await delay(100);

      const choicesArea = el('div', 'choices-area');
      choicesArea.innerHTML = '<div class="choices-label">SNSに何か書く？</div>';

      const c1 = el('button', 'btn-choice saki-choice', '咲を支持する投稿をする');
      c1.onclick = () => { scores.saki += 3; day4Choice = 'saki'; showDay5School(); };
      const c2 = el('button', 'btn-choice ren-choice', '蓮を支持する投稿をする');
      c2.onclick = () => { scores.ren += 3; day4Choice = 'ren'; showDay5School(); };
      const c3 = el('button', 'btn-choice neutral-choice', '「ふたりと直接話す」とだけ書く');
      c3.onclick = () => { scores.neutral += 3; day4Choice = 'neutral'; showDay5School(); };
      const c4 = el('button', 'btn-choice', '何も書かない');
      c4.onclick = () => { day4Choice = 'none'; showDay5School(); };

      choicesArea.appendChild(c1);
      choicesArea.appendChild(c2);
      choicesArea.appendChild(c3);
      choicesArea.appendChild(c4);
      append(choicesArea);
    }

    // ============================================
    // DAY 5：学校（最終日）
    // ============================================
    async function showDay5School() {
      clearScreen();
      setDayLabel('Day 5 — 学校');
      currentDay = 5;

      const card = el('div', 'day-card');
      card.innerHTML = `
        <div class="day-card-num">DAY 5</div>
        <div class="day-card-title">最後の朝</div>
        <div class="day-card-sub">文化祭前日</div>
      `;
      append(card);

      await delay(200);
      addNarration('文化祭の前日。Hanaが朝早くに教室に来ていた。');
      await delay(300);
      addDialogue('hana', 'Hana', 'ユウ、聞いてくれる？　咲も蓮も、もうギリギリのとこにいる。どっちかが折れるか、誰かが間に入るかしないと、文化祭当日にぐちゃぐちゃになると思う。');
      await delay(300);
      addDialogue('hana', 'Hana', 'でも……私には荷が重くて。ユウならできると思う。');
      await delay(300);
      addNarration('あなたの胸に、今まで見てきたものが浮かぶ。SNSの言葉、ふたりの表情、Hanaの声。');
      await delay(200);
      addSectionHeader('あなたは何をする？');

      await delay(100);
      const choicesArea = el('div', 'choices-area');
      choicesArea.innerHTML = '<div class="choices-label">最後の選択</div>';

      const c1 = el('button', 'btn-choice saki-choice', 'A：咲に直接話す（蓮への怒りを整理する手伝い）');
      c1.onclick = () => { finalChoice = 'A'; scores.saki += 2; showEnding(); };
      const c2 = el('button', 'btn-choice ren-choice', 'B：蓮に直接話す（咲への不満を聞き出す）');
      c2.onclick = () => { finalChoice = 'B'; scores.ren += 2; showEnding(); };
      const c3 = el('button', 'btn-choice neutral-choice', 'C：ふたりを呼んで、三人で話し合う場を作る');
      c3.onclick = () => { finalChoice = 'C'; scores.neutral += 5; showEnding(); };
      const c4 = el('button', 'btn-choice', 'D：「自分には関係ない」と思って何もしない');
      c4.onclick = () => { finalChoice = 'D'; showEnding(); };

      choicesArea.appendChild(c1);
      choicesArea.appendChild(c2);
      choicesArea.appendChild(c3);
      choicesArea.appendChild(c4);
      append(choicesArea);
    }

    // ============================================
    // エンディング分岐ロジック
    // ============================================
    function determineEnding() {
      if (finalChoice === 'D') return 'bystander';
      if (finalChoice === 'C' && scores.neutral >= 10) return 'reconcile';
      if (finalChoice === 'A' || finalChoice === 'B') {
        if (scores.neutral >= 6) return 'partial';
        else return 'onesided';
      }
      if (finalChoice === 'C') return 'partial';
      return 'bystander';
    }

    // ============================================
    // エンディング
    // ============================================
    async function showEnding() {
      clearScreen();

      const ending = determineEnding();

      const endingData = {
        reconcile: {
          color: '#27ae60',
          title: '和解',
          subtitle: 'ENDING：和解',
          body: `文化祭の前日、三人はぎりぎりまで話した。<br><br>
咲は「私、ちゃんと聞いてなかった」と言った。蓮は「俺も言い方がきつかった」と認めた。<br><br>
翌日の文化祭、お化け屋敷は成功した。完璧ではなかった。でも、完成した。<br><br>
SNSのフィードを開くと、クラスメートが一緒に写った写真を上げていた。咲と蓮も、同じフレームの中にいた。<br><br>
あなたは、ふたりが見えていなかったお互いの景色を見せた。それだけで、世界は少しだけ変わった。`,
        },
        partial: {
          color: '#f39c12',
          title: '片方だけ\n救った',
          subtitle: 'ENDING：片方だけ救った',
          body: `文化祭は終わった。<br><br>
あなたが話を聞いたほうは、少しだけ楽になった。でも、もう片方はまだ傷ついたままだった。<br><br>
クラスの亀裂は消えなかった。それでも——誰かの話を聞いたこと、それは本物だった。<br><br>
「正しい側」に立つことと、「誰かの話を聞く」ことは、違うことだとあなたは気づいた。<br><br>
次にどうするか、それはあなた次第だ。`,
        },
        onesided: {
          color: '#e74c3c',
          title: '一方的に\n終わった',
          subtitle: 'ENDING：一方的に終わった',
          body: `文化祭は終わった。表向きは。<br><br>
あなたは片方の声を聞き続けた。気づけば、もう片方の声がフィードから消えていた——いや、見えなくなっていた。<br><br>
相手が変わったのではなく、あなたが見なくなったのだ。<br><br>
咲と蓮は、文化祭が終わってもほとんど話さなくなった。あなたはその片方と一緒にいた。<br><br>
もう片方の顔を、あなたはもうよく覚えていない。`,
        },
        bystander: {
          color: '#555',
          title: '傍観',
          subtitle: 'ENDING：傍観',
          body: `文化祭は、なんとか終わった。<br><br>
あなたは何もしなかった。巻き込まれたくなかった。それは合理的な判断だったかもしれない。<br><br>
咲も蓮も、それぞれ傷ついたまま、それぞれのグループの中に消えていった。<br><br>
Hanaは翌日、あなたにメッセージを送ってこなかった。<br><br>
「既読」のマークだけが、青く光っていた。`,
        },
      };

      const data = endingData[ending];

      setDayLabel('ENDING');

      const endScreen = el('div', 'ending-screen');
      endScreen.innerHTML = `
        <div style="font-size:11px;color:#444;letter-spacing:3px">ENDING</div>
        <div class="ending-title" style="color:${data.color}">${data.title}</div>
        <div class="ending-subtitle" style="color:${data.color}40;font-size:12px">${data.subtitle}</div>
        <div class="ending-body">${data.body}</div>
      `;
      append(endScreen);

      await delay(600);
      addButton('→ あなたのバイアスを確認する', 'btn-next', () => showBiasVisualization(ending));
    }

    // ============================================
    // バイアス可視化
    // ============================================
    async function showBiasVisualization(ending) {
      clearScreen();
      setDayLabel('振り返り');

      addSectionHeader('フィルターバブル診断');
      addNarration('ゲームを通じたあなたの行動パターンを分析しました。');

      await delay(400);

      const total = scores.saki + scores.ren + scores.neutral;
      const safeTotal = total <= 0 ? 1 : total;
      const sakiPct  = Math.max(0, Math.min(100, Math.round((scores.saki / safeTotal) * 100)));
      const renPct   = Math.max(0, Math.min(100, Math.round((scores.ren / safeTotal) * 100)));
      const neutralPct = Math.max(0, Math.min(100, 100 - sakiPct - renPct));

      const biasSection = el('div', 'bias-section');
      biasSection.innerHTML = `
        <div class="bias-title">あなたの行動スコア</div>

        <div class="bias-bar-row">
          <div class="bias-bar-label">
            <span>咲 よりの行動</span>
            <span>${sakiPct}%</span>
          </div>
          <div class="bias-bar-bg">
            <div class="bias-bar-fill fill-saki" style="width:0%" data-target="${sakiPct}%"></div>
          </div>
        </div>

        <div class="bias-bar-row">
          <div class="bias-bar-label">
            <span>蓮 よりの行動</span>
            <span>${renPct}%</span>
          </div>
          <div class="bias-bar-bg">
            <div class="bias-bar-fill fill-ren" style="width:0%" data-target="${renPct}%"></div>
          </div>
        </div>

        <div class="bias-bar-row">
          <div class="bias-bar-label">
            <span>中立・両者を聞く行動</span>
            <span>${neutralPct}%</span>
          </div>
          <div class="bias-bar-bg">
            <div class="bias-bar-fill fill-neutral" style="width:0%" data-target="${neutralPct}%"></div>
          </div>
        </div>

        <div class="bias-desc">
          SNSのアルゴリズムは、あなたが「いいね」を押したコンテンツに似た情報を優先的に届けます。
          あなたが片方の声を多く肯定すればするほど、相手側の声は届きにくくなります。<br><br>
          これがフィルターバブルです。誰かが悪いわけではありません。
          仕組みそのものが、私たちを少しずつ「自分だけの世界」に閉じ込めていきます。<br><br>
          <strong style="color:#ccc">気づくことが、最初の一歩です。</strong>
        </div>
      `;
      append(biasSection);

      // アニメーション
      setTimeout(() => {
        const bars = biasSection.querySelectorAll('.bias-bar-fill');
        bars.forEach(bar => {
          bar.style.width = bar.dataset.target;
        });
      }, 200);

      await delay(600);
      addButton('→ もう一度プレイする', 'btn-next', () => {
        scores = { saki: 0, ren: 0, neutral: 0 };
        currentDay = 0;
        day4Choice = null;
        finalChoice = null;
        showTitle();
      });
    }

    // ============================================
    // 起動
    // ============================================
    showTitle();
  </script>
</body>
</html>
