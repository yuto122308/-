<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BCMediaQuest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#0095f6;--green:#25d366;--red:#ed4956;
  --gray:#8e8e8e;--border:#dbdbdb;--text:#262626;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;
  background:#111;display:flex;justify-content:center;align-items:center;
  min-height:100vh;overflow:hidden;
}
#app{
  width:390px;height:844px;background:#fff;border-radius:44px;
  overflow:hidden;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
  transition:opacity 0.3s ease;
}
@media(max-height:900px){#app{width:100vw;height:100vh;border-radius:0;}}
@media(max-width:430px){#app{width:100vw;height:100vh;border-radius:0;}}

/* ── TITLE ── */
.t-screen{
  width:100%;height:100%;
  background:linear-gradient(160deg,#0d0d1a,#1a1a3e,#0d1a2e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;position:relative;overflow:hidden;
}
.t-stars{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 25%,rgba(255,255,255,0.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 80% 15%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(2px 2px at 45% 65%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 90% 70%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 25% 85%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(2px 2px at 65% 40%,rgba(255,255,255,0.3) 0%,transparent 100%);
}
.t-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.t-icon{font-size:52px;margin-bottom:8px;}
.t-logo{font-size:38px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 40px rgba(100,150,255,0.8);}
.t-logo span{color:#64b5f6;}
.t-tag{font-size:13px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.6;margin-bottom:32px;}
.t-btn{
  background:linear-gradient(135deg,#42a5f5,#1565c0);
  color:#fff;border:none;padding:16px 56px;border-radius:30px;
  font-size:17px;font-weight:800;cursor:pointer;letter-spacing:0.5px;
  box-shadow:0 8px 32px rgba(66,165,245,0.4);transition:transform 0.2s,box-shadow 0.2s;
}
.t-btn:hover{transform:scale(1.04);box-shadow:0 12px 40px rgba(66,165,245,0.5);}
.t-note{margin-top:24px;font-size:11px;color:rgba(255,255,255,0.25);text-align:center;line-height:1.7;}

/* ── DAY CARD ── */
.dc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.dc-bg{font-size:110px;font-weight:900;color:rgba(255,255,255,0.1);line-height:1;letter-spacing:-6px;}
.dc-label{font-size:34px;font-weight:900;color:#fff;letter-spacing:4px;}
.dc-sub{font-size:14px;color:rgba(255,255,255,0.55);}
.dc-btn{
  margin-top:36px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
  color:#fff;padding:14px 40px;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;
  transition:background 0.2s;
}
.dc-btn:hover{background:rgba(255,255,255,0.25);}

/* ── NOVEL ── */
.nv{width:100%;height:100%;position:relative;cursor:pointer;user-select:none;}
.nv-bg{position:absolute;inset:0;}
.bg-cd{background:linear-gradient(180deg,#7ec8e3 0%,#b8d4f0 35%,#fff8e7 65%,#d2b48c 85%,#8b7355 100%);}
.bg-ce{background:linear-gradient(180deg,#ff8c42 0%,#ff6b35 30%,#fff3e0 65%,#d2b48c 85%,#8b7355 100%);}
.bg-cn{background:linear-gradient(180deg,#1a1a3e 0%,#2d2d5e 40%,#1a1a2e 100%);}
.nv-box{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(8,8,24,0.88);backdrop-filter:blur(10px);
  padding:20px 22px 32px;border-top:1px solid rgba(255,255,255,0.1);
  min-height:160px;
}
.nv-sp{font-size:12px;font-weight:700;color:#64b5f6;margin-bottom:8px;letter-spacing:0.5px;}
.nv-tx{font-size:15px;color:#fff;line-height:1.8;transition:opacity 0.15s;}
.nv-adv{
  position:absolute;bottom:14px;right:20px;
  font-size:11px;color:rgba(255,255,255,0.35);
  animation:blink 1.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── TUTORIAL ── */
.tu{width:100%;height:100%;background:linear-gradient(160deg,#e3f2fd,#f3e5f5);display:flex;flex-direction:column;padding:48px 22px 28px;overflow-y:auto;gap:0;}
.tu-h{font-size:22px;font-weight:900;color:#1565c0;margin-bottom:6px;}
.tu-s{font-size:12px;color:var(--gray);margin-bottom:20px;}
.tu-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid #42a5f5;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.tu-it{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.tu-id{font-size:12px;color:var(--gray);line-height:1.5;}
.spc{flex:1;}

/* ── SNS ── */
.sns{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;overflow:hidden;}
.sns-nav{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sns-logo{font-size:20px;font-weight:700;font-style:italic;color:var(--text);}
.sns-icons{display:flex;gap:18px;font-size:22px;}
.pw{flex:1;overflow-y:auto;}
.pur{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.pav{width:36px;height:36px;border-radius:50%;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.pun{font-size:13px;font-weight:700;flex:1;}
.pm{color:var(--gray);font-size:22px;}
.pi{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;}
.pie{font-size:80px;position:relative;z-index:1;}
.pil{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.5));color:#fff;padding:20px 14px 10px;font-size:12px;z-index:2;}
.pi-prep{background:linear-gradient(135deg,#a8edea,#fed6e3);}
.pi-deco{background:linear-gradient(135deg,#f6d365,#fda085);}
.pi-tea{background:linear-gradient(135deg,#a18cd1,#fbc2eb);}
.pi-grp{background:linear-gradient(135deg,#667eea,#764ba2);}
.pi-vrl{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);background-size:300%;animation:gshift 3s ease infinite;}
@keyframes gshift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.par{display:flex;padding:10px 14px;gap:16px;align-items:center;flex-shrink:0;}
.pa{font-size:24px;cursor:pointer;}
.plr{padding:0 14px 4px;font-size:13px;font-weight:800;flex-shrink:0;}
.pcr{padding:0 14px 10px;font-size:13px;line-height:1.5;flex-shrink:0;}
.pcu{font-weight:700;}
.psr{padding:0 14px 8px;font-size:11px;color:var(--gray);display:flex;gap:12px;flex-shrink:0;}
.sf{padding:12px 16px 20px;border-top:1px solid var(--border);flex-shrink:0;}

/* ── VIRAL ── */
.vr{width:100%;height:100%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;padding:24px;}
.vr-lbl{font-size:12px;color:rgba(255,255,255,0.35);letter-spacing:1px;}
.vr-ctr{font-size:58px;font-weight:900;color:#fff;display:flex;align-items:center;gap:12px;letter-spacing:-2px;transition:transform 0.2s;}
.vr-ctr.pop{transform:scale(1.1);}
.vr-heart{color:var(--red);}
.vr-badge{background:linear-gradient(135deg,#FFD700,#FFA500);color:#333;font-size:18px;font-weight:900;padding:12px 28px;border-radius:30px;margin-top:16px;display:none;box-shadow:0 8px 24px rgba(255,165,0,0.4);}

/* ── LINE ── */
.lc{width:100%;height:100%;background:#e5ddd5;display:flex;flex-direction:column;}
.lch{padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.lca{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;}
.lcn{color:#fff;font-size:16px;font-weight:700;}
.lcs{color:rgba(255,255,255,0.65);font-size:11px;margin-top:1px;}
.lm{flex:1;padding:12px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.lmsg{display:flex;align-items:flex-end;gap:8px;opacity:0;transform:translateY(8px);transition:opacity 0.3s,transform 0.3s;}
.lmsg.s{opacity:1;transform:none;}
.lmsg.r{flex-direction:row-reverse;}
.lav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;}
.lmb{max-width:65%;}
.lmn{font-size:10px;color:rgba(0,0,0,0.45);margin-bottom:3px;padding-left:2px;}
.lb{border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,0.1);}
.lb-w{background:#fff;color:var(--text);border-bottom-left-radius:4px;}
.lb-g{background:#25d366;color:#fff;border-bottom-right-radius:4px;}
.lt{font-size:10px;color:rgba(0,0,0,0.35);padding-bottom:2px;}
.lf{padding:12px 16px 20px;background:rgba(0,0,0,0.04);border-top:1px solid rgba(0,0,0,0.08);flex-shrink:0;}

/* ── RANKING ── */
.rk{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;}
.rkh{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.rkht{font-size:18px;font-weight:800;}
.rkhs{font-size:12px;color:var(--gray);margin-top:2px;}
.rkl{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.rki{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;}
.rki.mine{background:#e8f4fd;border-color:#90caf9;}
@keyframes cpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.rki.cel{animation:cpulse 0.6s ease 3;}
.rkn{font-size:22px;font-weight:900;width:32px;text-align:center;}
.rkc{flex:1;}
.rkcn{font-size:15px;font-weight:600;}
.rkch{font-size:11px;color:var(--gray);margin-top:1px;}
.rkl2{font-size:15px;font-weight:800;}
.rkmsg{margin:0 16px 12px;padding:14px;background:#fffde7;border:1px solid #fff176;border-radius:12px;font-size:14px;font-weight:600;color:#f57f17;text-align:center;}
.rkf{padding:0 16px 20px;flex-shrink:0;}

/* ── POST CREATE ── */
.pc{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;}
.pch{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.pcht{font-size:17px;font-weight:800;}
.pchs{font-size:12px;color:var(--gray);margin-top:2px;}
.pcb{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
.pcpv{border:2px solid var(--border);border-radius:16px;overflow:hidden;}
.pcpi{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:80px;}
.pcca{padding:14px;background:#fafafa;border-top:1px solid var(--border);}
.pccl{font-size:10px;color:var(--gray);margin-bottom:6px;}
.pcct{font-size:14px;color:var(--text);line-height:1.6;white-space:pre-line;}
.pcnt{background:#e3f2fd;border-radius:12px;padding:14px;font-size:12px;color:#1565c0;line-height:1.6;}
.pcf{padding:12px 16px 24px;flex-shrink:0;}

/* ── LOCK ── */
.lks{width:100%;height:100%;background:linear-gradient(150deg,#1a1a2e,#16213e,#0f3460);display:flex;flex-direction:column;justify-content:space-between;padding:56px 22px 36px;}
.lkt{font-size:80px;font-weight:200;color:#fff;letter-spacing:-3px;line-height:1;}
.lkd{font-size:14px;color:rgba(255,255,255,0.55);margin-top:4px;margin-bottom:28px;}
.lkns{display:flex;flex-direction:column;gap:10px;}
.lkn{background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(10px);transition:opacity 0.4s,transform 0.4s;}
.lkn.s{opacity:1;transform:none;}
.lkni{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.lkna{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:2px;}
.lknt{font-size:13px;color:#fff;font-weight:500;}
.lkbdg{background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;margin-left:auto;min-width:30px;text-align:center;}
.lkh{font-size:12px;color:rgba(255,255,255,0.3);text-align:center;margin-bottom:10px;}

/* ── QUOTE FEED ── */
.qf{width:100%;height:100%;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px;}
.qfl{font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;}
.qfc{font-size:88px;font-weight:900;color:#fff;letter-spacing:-4px;line-height:1;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);}
.qfc.ch{color:rgba(255,255,255,0.2);}
.qfs{font-size:13px;color:rgba(255,255,255,0.3);text-align:center;line-height:1.6;}
.qfp{width:100%;max-width:180px;}
.qfpb{height:2px;background:rgba(255,255,255,0.08);border-radius:1px;overflow:hidden;}
.qfpf{height:100%;background:rgba(255,255,255,0.35);border-radius:1px;transition:width 1s ease;}

/* ── COMMENTS ── */
.cs{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;}
.csm{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:#fafafa;}
.csmt{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.csmca{font-size:12px;color:var(--text);line-height:1.4;}
.csmst{font-size:11px;color:var(--gray);margin-top:3px;}
.clist{flex:1;overflow-y:auto;}
.cr{padding:12px 16px;border-bottom:1px solid #f5f5f5;display:flex;gap:10px;opacity:0;transform:translateY(5px);transition:opacity 0.35s,transform 0.35s;}
.cr.s{opacity:1;transform:none;}
.cav{width:30px;height:30px;border-radius:50%;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.cname{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.ctxt{font-size:13px;color:var(--text);line-height:1.45;}
.ctm{font-size:10px;color:var(--gray);margin-top:3px;}
.ctag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;}
.tg-s{background:#d4edda;color:#155724;}
.tg-n{background:#e8e8e8;color:#555;}
.tg-c{background:#fff3cd;color:#856404;}
.cnote{padding:12px 16px;background:#fffde7;border-top:1px solid #fff176;font-size:12px;color:#856404;line-height:1.6;flex-shrink:0;}
.cf{padding:12px 16px 20px;flex-shrink:0;}

/* ── ENDING ── */
.en{width:100%;height:100%;background:linear-gradient(160deg,#1a1a2e,#2d1b3d);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;gap:22px;}
.en-ic{font-size:44px;}
.en-ln{width:60px;height:1px;background:rgba(255,255,255,0.2);}
.en-tx{font-size:15px;color:rgba(255,255,255,0.82);line-height:1.95;text-align:center;white-space:pre-line;}

/* ── REFLECTION ── */
.rf{width:100%;height:100%;background:#fff;display:flex;flex-direction:column;align-items:center;padding:48px 24px 32px;gap:18px;overflow-y:auto;}
.rf-ic{font-size:40px;}
.rf-q{font-size:19px;font-weight:900;color:var(--text);text-align:center;line-height:1.5;}
.rf-bd{font-size:13px;color:var(--gray);line-height:1.7;text-align:center;}
.rf-sp{width:100%;background:#f5f5f5;border:2px dashed var(--border);border-radius:16px;padding:20px;text-align:center;font-size:13px;color:#bbb;font-style:italic;line-height:1.6;}
.rf-facts{padding:14px;background:#f9f9f9;border-radius:12px;width:100%;}
.rf-ft{font-size:12px;font-weight:700;color:#555;margin-bottom:8px;}
.rf-fd{font-size:12px;color:var(--gray);line-height:1.8;}

/* ── BUTTONS ── */
.btn{display:block;width:100%;padding:15px;font-size:15px;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform 0.15s,opacity 0.15s;text-align:center;}
.btn:active{transform:scale(0.97);opacity:0.85;}
.btn-bl{background:#0095f6;color:#fff;}
.btn-bl:hover{background:#0082d6;}
.btn-gr{background:#25d366;color:#fff;}
.btn-gr:hover{background:#20b858;}
.btn-dk{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.25);}
.btn-dk:hover{background:rgba(255,255,255,0.22);}
.btn-ol{background:#fff;color:#0095f6;border:2px solid #0095f6;}
.btn-ol:hover{background:#e8f4fd;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ════════════════════════════════════════
//  SCENE DATA
// ════════════════════════════════════════
const S = [
  {t:'title'},

  // DAY 1
  {t:'dc',day:1,sub:'文化祭まで7日',bg:'#1b5e20'},
  {t:'nv',bg:'cd',ln:[

    {sp:'クラスメイト',tx:'やばい！！うちのクラス絶対やれる気がする！！'},

    {sp:'',tx:'あなたはB組のSNS広報責任者になった。文化祭まであと7日。'},
  ]},
  {t:'tu'},

  // DAY 2
  {t:'dc',day:2,sub:'文化祭まで6日',bg:'#0d47a1'},
  {t:'nv',bg:'cd',ln:[
    {sp:'',tx:'放課後、準備が始まった。みんながワイワイしながら作業している。'},
    {sp:'',tx:'準備の様子を写真に撮り、初めての投稿をした。'},
  ]},
  {t:'post',post:{img:'prep',lbl:'B組 準備スタート！',
    cap:'文化祭まで6日！B組の準備が始まりました🎊\nみんなで力を合わせて頑張ります！\n#文化祭 #B組 #BCMediaQuest',
    likes:120,comments:8,shares:3,anim:false}},
  {t:'line',room:'class',hdr:'#4caf93',msgs:[
    {f:'アキ',av:'A',c:'#e91e63',tx:'いいじゃん！！',d:500},
    {f:'委員長・ユイ',av:'Y',c:'#2196f3',tx:'いいね数増えてきてる！',d:1100},
    {f:'クラスメイト',av:'M',c:'#ff9800',tx:'写真かわいい！',d:1700},
  ]},

  // DAY 3
  {t:'dc',day:3,sub:'文化祭まで5日',bg:'#4a148c'},
  {t:'nv',bg:'ce',ln:[
    {sp:'',tx:'放課後、装飾作りが本格化してきた。'},
    {sp:'委員長・ユイ',tx:'これ絶対バズるよ！メイキング動画好きな人多いし。'},
    {sp:'',tx:'装飾メイキングの様子を投稿した。'},
  ]},

    const app = document.getElementById('app');
    app.style.opacity = '0';
    setTimeout(() => {
      this.render(this.i);
      setTimeout(() => app.style.opacity = '1', 40);
    }, 280);
  },

  render(i) {
    const sc = S[i];
    const app = document.getElementById('app');
    const fn = this['r_' + sc.t];

      this['s_' + sc.t] && this['s_' + sc.t].call(this, sc);

    return {prep:'🎨',deco:'✨',tea:'👨‍🏫',grp:'👥'}[img] || '📸';

  animNum(el, from, to, dur) {
    const t0 = performance.now();
    (function tick(now) {
      const p = Math.min((now-t0)/dur, 1);
      const e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(from+(to-from)*e).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  },

      <div class="cf"><button class="btn btn-bl" id="cnxt" style="display:none;" onclick="G.next()">次へ →</button></div>
    </div>`;
  },

  s_cmts() {
    const data = [
      {av:'😊',n:'user_2847',tx:'青春って感じで良いね',tag:'tg-s',tl:'好意的'},
      {av:'🤔',n:'通りすがり',tx:'準備やりすぎでは…？',tag:'tg-n',tl:'疑問'},
      {av:'😶',n:'unknown_301',tx:'顔出し大丈夫？本人たちは知ってるの？',tag:'tg-c',tl:'懸念'},
      {av:'💬',n:'学校OB',tx:'クラスTの名前が気になる',tag:'tg-n',tl:'中立'},
      {av:'🙂',n:'保護者らしき人',tx:'別に問題なくない？楽しそうだし',tag:'tg-s',tl:'好意的'},
      {av:'😐',n:'名無し',tx:'本人たちはどう思ってるんだろう',tag:'tg-c',tl:'懸念'},
      {av:'✌️',n:'同じ学校かも',tx:'うちの学校っぽい',tag:'tg-n',tl:'中立'},
      {av:'😔',n:'関係者らしき人',tx:'あの場にいたけど…なんか複雑',tag:'tg-c',tl:'懸念'},
    ];
    const c = document.getElementById('clist');
    let max = 0;
    data.forEach((d,i)=>{
      const div = document.createElement('div');
      div.className = 'cr';
      div.innerHTML = `<div class="cav">${d.av}</div>
        <div><div class="cname">${d.n}<span class="ctag ${d.tag}">${d.tl}</span></div>
        <div class="ctxt">${d.tx}</div><div class="ctm">${i+1}分前</div></div>`;
      c.appendChild(div);
      const delay = 600 + i*480;
      if (delay > max) max = delay;
      setTimeout(()=>div.classList.add('s'), delay);
    });
    setTimeout(()=>{ const b=document.getElementById('cnxt'); if(b) b.style.display='block'; }, max+900);
  },

  // ── ENDING ──
  r_end() {
    return `<div class="en">
      <div class="en-ic">📱</div>
      <div class="en-ln"></div>
      <div class="en-tx">あなたはクラスを盛り上げたいと思っていた。

みんなも喜んでいた。

投稿は成功した。

それでも投稿はあなたの意図とは
違う意味で広がった。

SNSでは送り手と受け手が
同じ景色を見ているとは限らない。</div>
      <div class="en-ln"></div>
      <button class="btn btn-dk" style="max-width:200px;" onclick="G.next()">次へ →</button>
    </div>`;
  },

  // ── REFLECTION ──
  r_refl() {
    return `<div class="rf">
