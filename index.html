<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>既読 — フィルターバブル体験ゲーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: 'Noto Sans JP', sans-serif; color: #fff; padding: 30px 0; }
    #phone { width: 390px; min-height: 700px; background: #1a1a1a; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 2px #2a2a2a, 0 0 80px rgba(80,80,80,0.2); position: relative; }
    #status-bar { background: #111; padding: 12px 20px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #888; border-bottom: 1px solid #222; flex-shrink: 0; }
    #day-label { font-weight: 700; color: #aaa; font-size: 12px; }
    #screen { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    #screen::-webkit-scrollbar { width: 3px; }
    #screen::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .fade-in { animation: fadeIn 0.4s ease both; }
    .title-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 620px; text-align: center; animation: fadeIn 0.8s ease both; }
    .title-logo { font-size: 64px; font-weight: 700; letter-spacing: 12px; color: #fff; margin-bottom: 8px; }
    .title-subtitle { font-size: 13px; color: #555; letter-spacing: 2px; margin-bottom: 40px; }
    .title-desc { font-size: 13px; color: #777; line-height: 1.8; margin-bottom: 50px; max-width: 280px; }
    .btn-primary { background: #fff; color: #0d0d0d; border: none; padding: 14px 40px; border-radius: 30px; font-size: 15px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; letter-spacing: 2px; }
    .btn-primary:hover { background: #ddd; transform: scale(1.03); }
    .btn-choice { background: #222; color: #eee; border: 1px solid #333; padding: 14px 16px; border-radius: 12px; font-size: 13px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; text-align: left; transition: all 0.2s; line-height: 1.5; width: 100%; }
    .btn-choice:hover { background: #2a2a2a; border-color: #555; transform: translateX(3px); }
    .btn-choice.saki-choice { border-left: 3px solid #c0392b; }
    .btn-choice.ren-choice { border-left: 3px solid #2980b9; }
    .btn-choice.neutral-choice { border-left: 3px solid #27ae60; }
    .btn-next { background: #222; color: #888; border: 1px solid #333; padding: 10px 20px; border-radius: 20px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; align-self: center; margin-top: 8px; }
    .btn-next:hover { background: #2a2a2a; color: #ccc; }
    .section-header { background: #111; border-radius: 10px; padding: 10px 14px; font-size: 11px; color: #666; text-align: center; letter-spacing: 2px; text-transform: uppercase; animation: fadeIn 0.4s ease both; }
    .narration { font-size: 13px; color: #aaa; line-height: 1.9; padding: 4px 2px; animation: fadeIn 0.5s ease both; }
    .narration-emphasis { color: #ddd; font-size: 14px; font-weight: 500; line-height: 1.9; padding: 4px 2px; animation: fadeIn 0.5s ease both; }
    .char-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .icon-saki { background: #c0392b; } .icon-ren { background: #2980b9; } .icon-hana { background: #8e44ad; } .icon-yu { background: #2d5a27; }
    .dialogue-row { display: flex; gap: 10px; align-items: flex-start; animation: slideIn 0.4s ease both; }
    .dialogue-row.player-row { flex-direction: row-reverse; }
    .bubble { background: #252525; border-radius: 16px; padding: 10px 14px; font-size: 13px; line-height: 1.7; color: #e0e0e0; max-width: 240px; }
    .bubble.player-bubble { background: #2d5a27; color: #fff; }
    .dialogue-name { font-size: 10px; color: #666; margin-bottom: 4px; }
    .sns-post { background: #1e1e1e; border-radius: 12px; padding: 14px; animation: fadeIn 0.5s ease both; border: 1px solid #252525; }
    .sns-post-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sns-post-meta { display: flex; flex-direction: column; }
    .sns-post-name { font-size: 13px; font-weight: 700; color: #ccc; }
    .sns-post-time { font-size: 10px; color: #555; }
    .sns-post-text { font-size: 13px; color: #bbb; line-height: 1.7; margin-bottom: 12px; }
    .sns-post-actions { display: flex; gap: 8px; }
    .btn-like { background: #222; color: #888; border: 1px solid #333; padding: 6px 16px; border-radius: 16px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; flex: 1; }
    .btn-like:hover { background: #2a2a2a; color: #ddd; }
    .btn-like.liked { background: #c0392b; color: #fff; border-color: #c0392b; }
    .btn-skip { background: transparent; color: #555; border: 1px solid #282828; padding: 6px 14px; border-radius: 16px; font-size: 11px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; }
    .btn-skip:hover { color: #888; border-color: #444; }
    .dm-header { background: #111; border-radius: 12px 12px 0 0; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e1e1e; }
    .dm-partner-name { font-size: 14px; font-weight: 700; color: #ccc; }
    .dm-body { background: #111; border-radius: 0 0 12px 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .dm-row { display: flex; gap: 8px; align-items: flex-end; animation: fadeIn 0.4s ease both; }
    .dm-row.dm-player-row { flex-direction: row-reverse; }
    .dm-bubble { background: #222; border-radius: 16px; padding: 10px 14px; font-size: 13px; line-height: 1.6; color: #ddd; max-width: 220px; }
    .dm-bubble.dm-player-bubble { background: #2d5a27; color: #fff; }
    .kidoku-label { font-size: 10px; color: #555; text-align: right; margin-top: -4px; animation: fadeIn 0.3s ease 0.8s both; }
    .kidoku-label.read { color: #2980b9; }
    .split-screen { display: flex; gap: 8px; animation: fadeIn 0.6s ease both; }
    .split-panel { flex: 1; border-radius: 12px; padding: 12px; min-height: 180px; }
    .split-panel.saki-panel { background: rgba(192,57,43,0.15); border: 1px solid rgba(192,57,43,0.3); animation: slideInLeft 0.5s ease both; }
    .split-panel.ren-panel { background: rgba(41,128,185,0.15); border: 1px solid rgba(41,128,185,0.3); animation: slideInRight 0.5s ease both; }
    .split-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .split-label.saki-label { color: #c0392b; } .split-label.ren-label { color: #2980b9; }
    .split-post { font-size: 11px; color: #999; line-height: 1.6; margin-bottom: 8px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 8px; }
    .ending-screen { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 20px 4px; animation: fadeIn 0.8s ease both; }
    .ending-title { font-size: 28px; font-weight: 700; letter-spacing: 4px; }
    .ending-body { font-size: 13px; color: #aaa; line-height: 1.9; text-align: left; background: #1a1a1a; border-radius: 12px; padding: 16px; border: 1px solid #252525; }
    .bias-section { animation: fadeIn 0.6s ease both; }
    .bias-title { font-size: 14px; font-weight: 700; color: #ccc; margin-bottom: 12px; text-align: center; }
    .bias-bar-row { margin-bottom: 16px; }
    .bias-bar-label { font-size: 12px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bias-bar-bg { background: #222; border-radius: 4px; height: 12px; overflow: hidden; }
    .bias-bar-fill { height: 100%; border-radius: 4px; transition: width 1.2s ease; }
    .fill-saki { background: linear-gradient(90deg, #c0392b, #e74c3c); }
    .fill-ren { background: linear-gradient(90deg, #2980b9, #3498db); }
    .fill-neutral { background: linear-gradient(90deg, #27ae60, #2ecc71); }
    .bias-desc { font-size: 12px; color: #666; line-height: 1.8; margin-top: 16px; padding-top: 16px; border-top: 1px solid #222; }
    .choices-area { display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.5s ease both; }
    .choices-label { font-size: 11px; color: #555; text-align: center; letter-spacing: 1px; }
    .day-card { background: #111; border-radius: 14px; padding: 18px; text-align: center; animation: fadeIn 0.6s ease both; }
    .day-card-num { font-size: 11px; color: #555; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
    .day-card-title { font-size: 20px; font-weight: 700; color: #ccc; letter-spacing: 2px; }
    .day-card-sub { font-size: 12px; color: #444; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="phone">
    <div id="status-bar"><span id="day-label">— 既読 —</span><span>🔋</span></div>
    <div id="screen"></div>
  </div>
  <script>
    let scores = { saki: 0, ren: 0, neutral: 0 };
    let currentDay = 0, day4Choice = null, finalChoice = null;
    const screen = document.getElementById('screen');
    const dayLabel = document.getElementById('day-label');
    function setDayLabel(t) { dayLabel.textContent = t; }
    function clearScreen() { screen.innerHTML = ''; }
    function scrollToBottom() { setTimeout(() => screen.scrollTop = screen.scrollHeight, 50); }
    function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }
    function append(node) { screen.appendChild(node); scrollToBottom(); }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    function iconHtml(who) {
      const map = { saki:['icon-saki','咲'], ren:['icon-ren','蓮'], hana:['icon-hana','H'], yu:['icon-yu','ユ'] };
      const [cls, char] = map[who] || ['icon-yu','?'];
      return `<div class="char-icon ${cls}">${char}</div>`;
    }
    function addDialogue(who, name, text) {
      const isPlayer = who === 'yu';
      const row = el('div', `dialogue-row${isPlayer?' player-row':''}`);
      const nameHtml = name ? `<div class="dialogue-name">${name}</div>` : '';
      const icon = el('div'); icon.innerHTML = iconHtml(who);
      const wrap = el('div');
      wrap.innerHTML = `${nameHtml}<div class="bubble${isPlayer?' player-bubble':''}">${text}</div>`;
      if (isPlayer) { row.appendChild(wrap); row.appendChild(icon); } else { row.appendChild(icon); row.appendChild(wrap); }
      append(row);
    }
    function addNarration(text, emphasis) { append(el('p', emphasis?'narration-emphasis':'narration', text)); }
    function addSectionHeader(text) { append(el('div','section-header',text)); }
    function addButton(label, cls, fn) { const btn = el('button',cls,label); btn.onclick = fn; append(btn); return btn; }
    function showTitle() {
      clearScreen(); setDayLabel('— 既読 —');
      const wrap = el('div','title-screen');
      wrap.innerHTML = `<div class="title-logo">既読</div><div class="title-subtitle">— フィルターバブル体験ゲーム —</div><div class="title-desc">文化祭の準備をめぐって<br>クラスが二分されていく。<br><br>あなたはどちらの声を聞き、<br>何を信じるのか。</div>`;
      const btn = el('button','btn-primary','はじめる'); btn.onclick = () => showDay1School(); wrap.appendChild(btn); append(wrap);
    }
    async function showDay1School() {
      clearScreen(); setDayLabel('Day 1 — 学校'); currentDay = 1;
      const card = el('div','day-card'); card.innerHTML = `<div class="day-card-num">DAY 1</div><div class="day-card-title">集合写真</div><div class="day-card-sub">文化祭まで3週間</div>`; append(card);
      await delay(200); addNarration('昼休み。クラスの文化祭準備委員会が、初めて全員集まった。');
      await delay(300); addDialogue('saki','渡辺 咲','ねえ聞いて！　今年の出し物、私やっぱりお化け屋敷にしたいんだけど。');
      await delay(300); addDialogue('ren','中島 蓮','……カフェじゃダメなの？　去年みたいなやつ。収益も安定するし。');
      await delay(300); addDialogue('saki','渡辺 咲','また同じのやっても面白くないじゃん！　せっかくの高校最後の文化祭なのに。');
      await delay(300); addDialogue('ren','中島 蓮','「面白い」だけで決めて後で後悔するのが嫌なんだよ。去年のこと覚えてない？');
      await delay(300); addNarration('去年——前の委員長が強引に進めた出し物が直前で崩れ、クラスが一時ギスギスした。蓮はそれを引きずっている。');
      await delay(200); addSectionHeader('あなたはどう動く？'); await delay(100);
      const ca = el('div','choices-area'); ca.innerHTML = '<div class="choices-label">選択してください</div>';
      const c1 = el('button','btn-choice saki-choice','「お化け屋敷、やってみようよ。みんなで作るの楽しそう」'); c1.onclick=()=>{scores.saki+=2;showDay1SchoolEnd('saki');};
      const c2 = el('button','btn-choice ren-choice','「カフェのほうが現実的かもね。トラブル少なそう」'); c2.onclick=()=>{scores.ren+=2;showDay1SchoolEnd('ren');};
      const c3 = el('button','btn-choice neutral-choice','「ふたりの言いたいこと、もう少し聞かせてほしい」'); c3.onclick=()=>{scores.neutral+=4;showDay1SchoolEnd('neutral');};
      ca.appendChild(c1); ca.appendChild(c2); ca.appendChild(c3); append(ca);
    }
    async function showDay1SchoolEnd(choice) {
      const a = screen.querySelector('.choices-area'); if(a) a.remove();
      if(choice==='saki'){addDialogue('yu','ユウ','お化け屋敷、やってみようよ。みんなで作るの楽しそう。');await delay(200);addDialogue('saki','渡辺 咲','でしょでしょ！　ユウもそう思うよね！');await delay(200);addDialogue('ren','中島 蓮','……まあ、多数決で決めればいいじゃん。');}
      else if(choice==='ren'){addDialogue('yu','ユウ','カフェのほうが現実的かもね。トラブル少なそう。');await delay(200);addDialogue('ren','中島 蓮','そうだよ。ちゃんと考えてる人もいるんだよ咲。');await delay(200);addDialogue('saki','渡辺 咲','……（口をつぐんだ）');}
      else{addDialogue('yu','ユウ','ふたりの言いたいこと、もう少し聞かせてほしい。');await delay(200);addDialogue('saki','渡辺 咲','え？　……うん、いいけど。');await delay(200);addDialogue('ren','中島 蓮','……珍しいこと聞くね、ユウは。');}
      await delay(300); addNarration('放課後、Hanaからメッセージが来た。'); await delay(200); addButton('→ DMを確認する','btn-next',()=>showDay1DM());
    }
    async function showDay1DM() {
      clearScreen(); setDayLabel('Day 1 — DM'); addSectionHeader('Direct Message');
      const dh = el('div','dm-header'); dh.innerHTML = `${iconHtml('hana')}<span class="dm-partner-name">Hana</span>`; append(dh);
      const db = el('div','dm-body'); append(db);
      const msgs = [{who:'hana',text:'ユウ！　今日の委員会、見てたよ。咲と蓮またやりあってたね😅'},{who:'hana',text:'咲ってさ、ちょっと空気読めないとこあるよね。蓮がなんで慎重なのかわかってないじゃん'},{who:'hana',text:'ユウはどう思う？'}];
      for(let i=0;i<msgs.length;i++){await delay(400+i*300);const r=el('div','dm-row');r.innerHTML=iconHtml(msgs[i].who);const b=el('div','dm-bubble',msgs[i].text);r.appendChild(b);db.appendChild(r);scrollToBottom();}
      await delay(600); addButton('→ 返信する','btn-next',()=>showDay1DMReply());
    }
    async function showDay1DMReply() {
      const btn=screen.querySelector('.btn-next');if(btn)btn.remove();
      const db=screen.querySelector('.dm-body');
      const rr=el('div','dm-row dm-player-row');rr.innerHTML=`<div class="dm-bubble dm-player-bubble">うーん、どっちの気持ちもわかる気がする……</div>${iconHtml('yu')}`;db.appendChild(rr);scrollToBottom();
      await delay(400);const k=el('div','kidoku-label read','既読');db.appendChild(k);scrollToBottom();
      await delay(500);const hr=el('div','dm-row');hr.innerHTML=`${iconHtml('hana')}<div class="dm-bubble">そっか。まあ、あとでSNS見てみて。みんな色々言ってるよ</div>`;db.appendChild(hr);scrollToBottom();
      await delay(500); addButton('→ SNSを開く','btn-next',()=>showDay1SNS());
    }
    async function showDay1SNS() {
      clearScreen(); setDayLabel('Day 1 — SNS'); addSectionHeader('SNS タイムライン');
      const posts=[{who:'saki',name:'渡辺 咲',time:'16:42',text:'文化祭どうなるかな〜　お化け屋敷絶対楽しいのに😤　なんでみんなリスクとれないの',type:'saki'},{who:'ren',name:'中島 蓮',time:'16:55',text:'去年のこと忘れたの？　準備不足で崩れたら誰が後片付けするのか、ちゃんと考えてほしい',type:'ren'},{who:'hana',name:'Hana',time:'17:03',text:'文化祭の出し物論争、見てると疲れる😂　正直どっちでもいいよー',type:'neutral'}];
      for(let i=0;i<posts.length;i++){await delay(300+i*200);addSNSPost(posts[i],i);}
      await delay(300); addButton('→ Day 2へ','btn-next',()=>showDay2School());
    }
    function addSNSPost(post,index){
      const {who,name,time,text,type}=post;
      const p=el('div','sns-post'); p.style.animationDelay=`${index*0.1}s`;
      p.innerHTML=`<div class="sns-post-header">${iconHtml(who)}<div class="sns-post-meta"><span class="sns-post-name">${name}</span><span class="sns-post-time">${time}</span></div></div><div class="sns-post-text">${text}</div><div class="sns-post-actions"><button class="btn-like" data-type="${type}">♡ いいね</button><button class="btn-skip">スキップ</button></div>`;
      const lb=p.querySelector('.btn-like'),sb=p.querySelector('.btn-skip');
      lb.onclick=()=>{if(lb.classList.contains('liked'))return;lb.classList.add('liked');lb.textContent='♥ いいね済み';if(type==='saki')scores.saki+=2;else if(type==='ren')scores.ren+=2;else scores.neutral+=3;lb.disabled=true;sb.disabled=true;};
      sb.onclick=()=>{scores.neutral-=1;lb.disabled=true;sb.disabled=true;p.style.opacity='0.4';};
      append(p);
    }
    async function showDay2School() {
      clearScreen(); setDayLabel('Day 2 — 学校'); currentDay=2;
      const card=el('div','day-card');card.innerHTML=`<div class="day-card-num">DAY 2</div><div class="day-card-title">多数決</div><div class="day-card-sub">文化祭まで2週間半</div>`;append(card);
      await delay(200);addNarration('翌日、ホームルームで出し物を決める多数決が行われた。結果は——お化け屋敷、17票。カフェ、13票。');
      await delay(300);addDialogue('saki','渡辺 咲','やった！　多数決で決まったんだからさ、蓮も協力してよ！');
      await delay(300);addDialogue('ren','中島 蓮','……わかった。でも、進行管理は絶対にちゃんとやってほしい。');
      await delay(300);addDialogue('saki','渡辺 咲','任せて！　私が全部仕切るから！');
      await delay(300);addNarration('放課後の準備会議。咲が意気揚々と進行し始めたが、蓮の表情が硬い。');
      await delay(200);addDialogue('ren','中島 蓮','咲、小道具リスト、まだできてないの？　昨日言ったじゃん。');
      await delay(200);addDialogue('saki','渡辺 咲','今日中に出す！　ちょっと待って！');
      await delay(200);addDialogue('ren','中島 蓮','「今日中」って毎日言ってるよね……。');
      await delay(200);addSectionHeader('あなたはどう動く？');await delay(100);
      const ca=el('div','choices-area');ca.innerHTML='<div class="choices-label">選択してください</div>';
      const c1=el('button','btn-choice saki-choice','「咲、もうちょっと時間あげようよ。やる気あるんだから」');c1.onclick=()=>{scores.saki+=3;scores.ren-=2;showDay2SchoolEnd('saki');};
      const c2=el('button','btn-choice ren-choice','「蓮の言う通り、スケジュール管理はしっかりしないと」');c2.onclick=()=>{scores.ren+=3;scores.saki-=2;showDay2SchoolEnd('ren');};
      const c3=el('button','btn-choice neutral-choice','「リスト、一緒に作ろうか。30分でやれるよ」');c3.onclick=()=>{scores.neutral+=4;showDay2SchoolEnd('neutral');};
      ca.appendChild(c1);ca.appendChild(c2);ca.appendChild(c3);append(ca);
    }
    async function showDay2SchoolEnd(choice){
      const a=screen.querySelector('.choices-area');if(a)a.remove();
      if(choice==='saki'){addDialogue('yu','ユウ','咲、もうちょっと時間あげようよ。やる気あるんだから。');await delay(200);addDialogue('saki','渡辺 咲','ありがとユウ！　絶対やるから！');await delay(200);addDialogue('ren','中島 蓮','……（黙って席を立った）');}

    async function showDay2SNS(){

    async function showDay3SchoolMid(choice){
      const a=screen.querySelector('.choices-area');if(a)a.remove();
      if(choice==='saki'){addDialogue('yu','ユウ','咲、話して。（蓮に）ごめん、あとで。');await delay(200);addDialogue('ren','中島 蓮','……そっか。（立ち去った）');await delay(200);addDialogue('saki','渡辺 咲','蓮ってさ、自分の意見しか正しいと思ってないんだよね。去年のトラウマで視野が狭くなってる気がする。');}

    async function showDay3DM(){

      for(let i=0;i<msgs.length;i++){await delay(400+i*300);const r=el('div','dm-row');r.innerHTML=iconHtml(msgs[i].who);const b=el('div','dm-bubble',msgs[i].text);r.appendChild(b);db.appendChild(r);scrollToBottom();}

    async function showDay3SNS(){
      clearScreen();setDayLabel('Day 3 — SNS');addSectionHeader('SNS タイムライン');addNarration('フィードには、じわじわと対立の色が滲み始めていた。');await delay(200);
      const posts=[{who:'saki',name:'渡辺 咲',time:'21:05',text:'頑張ってるのに細かいことでいちいちつっかかってくる人、ほんとしんどい。準備楽しいのに😞',type:'saki'},{who:'ren',name:'中島 蓮',time:'21:33',text:'「楽しい」だけで動く人と一緒に仕事するの、こっちがどれだけ疲弊してるかわかってんの',type:'ren'},{who:'hana',name:'Hana',time:'22:01',text:'……誰も悪くないと思うんだけどな。ただ怖くて言えない',type:'neutral'}];
      for(let i=0;i<posts.length;i++){await delay(300+i*200);addSNSPost(posts[i],i);}

    }
    async function showDay4School(){
      clearScreen();setDayLabel('Day 4 — 学校');currentDay=4;
      const card=el('div','day-card');card.innerHTML=`<div class="day-card-num">DAY 4</div><div class="day-card-title">決裂</div><div class="day-card-sub">文化祭まで1週間</div>`;append(card);
      await delay(200);addNarration('文化祭まで残り1週間。準備は佳境に入っていたが——');
      await delay(300);addDialogue('saki','渡辺 咲','蓮、ちょっと！　なんで私の担当エリアに勝手に手を入れたの？！');
      await delay(300);addDialogue('ren','中島 蓮','誰もやらないから俺がやっただけだよ。どうせまた後回しにするつもりだったんじゃないの。');
      await delay(300);addDialogue('saki','渡辺 咲','信用してないってことじゃん！　最初からそうだった。多数決で負けたからって、ずっと邪魔してきたんじゃないの！');
      await delay(300);addDialogue('ren','中島 蓮','邪魔？　俺が何度スケジュール組み直したと思ってる。誰かがちゃんとしないと全部崩れるんだよ！');
      await delay(300);addNarration('教室中が静まりかえった。ふたりの言葉が、空中でぶつかって砕けていく。');
      await delay(400);addButton('→ ふたりの世界を見る','btn-next',()=>showDay4Comparison());
    }
    async function showDay4Comparison(){
      clearScreen();setDayLabel('Day 4 — それぞれの世界');
      addNarration('同じ出来事が、ふたりの目にはまったく違って映っていた。');await delay(400);
      const split=el('div','split-screen');
      const sp=el('div','split-panel saki-panel');sp.innerHTML=`<div class="split-label saki-label">咲 の世界</div><div class="split-post">「私が一番頑張ってる。なのに蓮はいつも否定する」</div><div class="split-post">フィードに流れてくるのは——蓮の批判、管理主義への嫌悪、咲を応援するリプライ</div><div class="split-post">「みんな私を支持してくれてる。蓮だけが浮いてる」</div>`;
      const rp=el('div','split-panel ren-panel');rp.innerHTML=`<div class="split-label ren-label">蓮 の世界</div><div class="split-post">「俺が動かなければ何も進まない。咲は無責任だ」</div><div class="split-post">フィードに流れてくるのは——咲の無計画さへの批判、蓮の仕事ぶりを称える声</div><div class="split-post">「だから俺が正しかった。みんなわかってくれてる」</div>`;
      split.appendChild(sp);split.appendChild(rp);append(split);
      await delay(600);addNarration('ふたりはSNSで、自分を肯定する声だけを浴び続けていた。相手の言葉は届かず、自分が正しいという確信だけが育っていった。');
      await delay(400);addNarration('これが——フィルターバブルの中にいる、ということ。');
      await delay(500);addButton('→ Day 4 SNSへ','btn-next',()=>showDay4SNS());
    }
    async function showDay4SNS(){
      clearScreen();setDayLabel('Day 4 — SNS');addSectionHeader('SNS タイムライン');addNarration('対立がSNSにあふれ出していた。');await delay(200);
      const posts=[{who:'saki',name:'渡辺 咲',time:'18:44',text:'自分のやり方だけが正しいと思ってる人、怖い。誰の文化祭なの？',type:'saki'},{who:'ren',name:'中島 蓮',time:'19:02',text:'感情で動いて失敗した時に誰かが責任取るの。最初から言ってた。',type:'ren'},{who:'hana',name:'Hana',time:'19:45',text:'ユウ、明日早めに来て。ちょっと話したいことある。',type:'neutral'}];
      for(let i=0;i<posts.length;i++){await delay(300+i*200);addSNSPost(posts[i],i);}
      await delay(500);addSectionHeader('あなたはどう動く？');await delay(100);
      const ca=el('div','choices-area');ca.innerHTML='<div class="choices-label">SNSに何か書く？</div>';
      const c1=el('button','btn-choice saki-choice','咲を支持する投稿をする');c1.onclick=()=>{scores.saki+=3;day4Choice='saki';showDay5School();};
      const c2=el('button','btn-choice ren-choice','蓮を支持する投稿をする');c2.onclick=()=>{scores.ren+=3;day4Choice='ren';showDay5School();};
      const c3=el('button','btn-choice neutral-choice','「ふたりと直接話す」とだけ書く');c3.onclick=()=>{scores.neutral+=3;day4Choice='neutral';showDay5School();};
      const c4=el('button','btn-choice','何も書かない');c4.onclick=()=>{day4Choice='none';showDay5School();};
      ca.appendChild(c1);ca.appendChild(c2);ca.appendChild(c3);ca.appendChild(c4);append(ca);
    }
    async function showDay5School(){
      clearScreen();setDayLabel('Day 5 — 学校');currentDay=5;
      const card=el('div','day-card');card.innerHTML=`<div class="day-card-num">DAY 5</div><div class="day-card-title">最後の朝</div><div class="day-card-sub">文化祭前日</div>`;append(card);
      await delay(200);addNarration('文化祭の前日。Hanaが朝早くに教室に来ていた。');
      await delay(300);addDialogue('hana','Hana','ユウ、聞いてくれる？　咲も蓮も、もうギリギリのとこにいる。どっちかが折れるか、誰かが間に入るかしないと、文化祭当日にぐちゃぐちゃになると思う。');
      await delay(300);addDialogue('hana','Hana','でも……私には荷が重くて。ユウならできると思う。');
      await delay(300);addNarration('あなたの胸に、今まで見てきたものが浮かぶ。SNSの言葉、ふたりの表情、Hanaの声。');
      await delay(200);addSectionHeader('あなたは何をする？');await delay(100);
      const ca=el('div','choices-area');ca.innerHTML='<div class="choices-label">最後の選択</div>';
      const c1=el('button','btn-choice saki-choice','A：咲に直接話す（蓮への怒りを整理する手伝い）');c1.onclick=()=>{finalChoice='A';scores.saki+=2;showEnding();};
      const c2=el('button','btn-choice ren-choice','B：蓮に直接話す（咲への不満を聞き出す）');c2.onclick=()=>{finalChoice='B';scores.ren+=2;showEnding();};
      const c3=el('button','btn-choice neutral-choice','C：ふたりを呼んで、三人で話し合う場を作る');c3.onclick=()=>{finalChoice='C';scores.neutral+=5;showEnding();};
      const c4=el('button','btn-choice','D：「自分には関係ない」と思って何もしない');c4.onclick=()=>{finalChoice='D';showEnding();};
      ca.appendChild(c1);ca.appendChild(c2);ca.appendChild(c3);ca.appendChild(c4);append(ca);
    }
    function determineEnding(){
      if(finalChoice==='D')return 'bystander';
      if(finalChoice==='C'&&scores.neutral>=10)return 'reconcile';
      if((finalChoice==='A'||finalChoice==='B')&&scores.neutral>=6)return 'partial';
      if(finalChoice==='A'||finalChoice==='B')return 'onesided';
      if(finalChoice==='C')return 'partial';
      return 'bystander';
    }
    async function showEnding(){
      clearScreen();
      const ending=determineEnding();
      const ed={
        reconcile:{color:'#27ae60',title:'和解',body:`文化祭の前日、三人はぎりぎりまで話した。<br><br>咲は「私、ちゃんと聞いてなかった」と言った。蓮は「俺も言い方がきつかった」と認めた。<br><br>翌日の文化祭、お化け屋敷は成功した。完璧ではなかった。でも、完成した。<br><br>SNSのフィードを開くと、クラスメートが一緒に写った写真を上げていた。咲と蓮も、同じフレームの中にいた。<br><br>あなたは、ふたりが見えていなかったお互いの景色を見せた。それだけで、世界は少しだけ変わった。`},
        partial:{color:'#f39c12',title:'片方だけ救った',body:`文化祭は終わった。<br><br>あなたが話を聞いたほうは、少しだけ楽になった。でも、もう片方はまだ傷ついたままだった。<br><br>クラスの亀裂は消えなかった。それでも——誰かの話を聞いたこと、それは本物だった。<br><br>「正しい側」に立つことと、「誰かの話を聞く」ことは、違うことだとあなたは気づいた。<br><br>次にどうするか、それはあなた次第だ。`},
        onesided:{color:'#e74c3c',title:'一方的に終わった',body:`文化祭は終わった。表向きは。<br><br>あなたは片方の声を聞き続けた。気づけば、もう片方の声がフィードから消えていた——いや、見えなくなっていた。<br><br>相手が変わったのではなく、あなたが見なくなったのだ。<br><br>咲と蓮は、文化祭が終わってもほとんど話さなくなった。あなたはその片方と一緒にいた。<br><br>もう片方の顔を、あなたはもうよく覚えていない。`},
        bystander:{color:'#555',title:'傍観',body:`文化祭は、なんとか終わった。<br><br>あなたは何もしなかった。巻き込まれたくなかった。それは合理的な判断だったかもしれない。<br><br>咲も蓮も、それぞれ傷ついたまま、それぞれのグループの中に消えていった。<br><br>Hanaは翌日、あなたにメッセージを送ってこなかった。<br><br>「既読」のマークだけが、青く光っていた。`}
      };
      const data=ed[ending]; setDayLabel('ENDING');
      const es=el('div','ending-screen');
      es.innerHTML=`<div style="font-size:11px;color:#444;letter-spacing:3px">ENDING</div><div class="ending-title" style="color:${data.color}">${data.title}</div><div class="ending-body">${data.body}</div>`;
      append(es);
      await delay(600);addButton('→ あなたのバイアスを確認する','btn-next',()=>showBiasVisualization());
    }
    async function showBiasVisualization(){
      clearScreen();setDayLabel('振り返り');addSectionHeader('フィルターバブル診断');addNarration('ゲームを通じたあなたの行動パターンを分析しました。');await delay(400);
      const total=scores.saki+scores.ren+scores.neutral;
      const st=total<=0?1:total;
      const sp=Math.max(0,Math.min(100,Math.round(scores.saki/st*100)));
      const rp=Math.max(0,Math.min(100,Math.round(scores.ren/st*100)));
      const np=Math.max(0,Math.min(100,100-sp-rp));
      const bs=el('div','bias-section');
      bs.innerHTML=`<div class="bias-title">あなたの行動スコア</div><div class="bias-bar-row"><div class="bias-bar-label"><span>咲 よりの行動</span><span>${sp}%</span></div><div class="bias-bar-bg"><div class="bias-bar-fill fill-saki" style="width:0%" data-target="${sp}%"></div></div></div><div class="bias-bar-row"><div class="bias-bar-label"><span>蓮 よりの行動</span><span>${rp}%</span></div><div class="bias-bar-bg"><div class="bias-bar-fill fill-ren" style="width:0%" data-target="${rp}%"></div></div></div><div class="bias-bar-row"><div class="bias-bar-label"><span>中立・両者を聞く行動</span><span>${np}%</span></div><div class="bias-bar-bg"><div class="bias-bar-fill fill-neutral" style="width:0%" data-target="${np}%"></div></div></div><div class="bias-desc">SNSのアルゴリズムは、あなたが「いいね」を押したコンテンツに似た情報を優先的に届けます。あなたが片方の声を多く肯定すればするほど、相手側の声は届きにくくなります。<br><br>これがフィルターバブルです。誰かが悪いわけではありません。仕組みそのものが、私たちを少しずつ「自分だけの世界」に閉じ込めていきます。<br><br><strong style="color:#ccc">気づくことが、最初の一歩です。</strong></div>`;
      append(bs);
      setTimeout(()=>{bs.querySelectorAll('.bias-bar-fill').forEach(b=>{b.style.width=b.dataset.target;});},200);
      await delay(600);addButton('→ もう一度プレイする','btn-next',()=>{scores={saki:0,ren:0,neutral:0};currentDay=0;day4Choice=null;finalChoice=null;showTitle();});
    }
    showTitle();
