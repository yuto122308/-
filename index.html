<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>既読 — フィルターバブル体験ゲーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Noto Sans JP', sans-serif; color: #fff; padding: 20px 0; }
    #phone { width: 390px; min-height: 700px; max-height: 90vh; background: #1a1a2e; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 2px #2a2a4a, 0 0 80px rgba(100,100,255,0.15); position: relative; }
    #status-bar { background: #0f0f1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; min-height: 48px; }
    #day-label { font-size: 13px; font-weight: 700; color: #7c7cff; letter-spacing: 2px; }
    #part-label { font-size: 11px; color: #888; background: #222; padding: 4px 10px; border-radius: 10px; letter-spacing: 1px; }
    #content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: #2a2a4a transparent; }
    #content::-webkit-scrollbar { width: 4px; }
    #content::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
    .chat-area { padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
    .chat-meta { display: flex; flex-direction: column; gap: 4px; }
    .chat-meta.right { align-items: flex-end; }
    .chat-name { font-size: 11px; color: #888; padding: 0 4px; }
    .chat-bubble { max-width: 80%; padding: 11px 15px; border-radius: 18px; font-size: 14px; line-height: 1.7; animation: fadeInUp 0.35s ease; }
    .chat-bubble.other { background: #252545; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-bubble.player { background: #4040e8; align-self: flex-end; border-bottom-right-radius: 4px; }
    .choice-area { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: fadeInUp 0.4s ease; }
    .choice-label { font-size: 11px; color: #666; letter-spacing: 1px; padding: 0 4px; margin-bottom: 4px; }
    .choice-btn { background: #1e1e3a; border: 1px solid #3a3a6a; color: #ddd; padding: 13px 16px; border-radius: 12px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; text-align: left; line-height: 1.6; transition: background 0.2s, border-color 0.2s, color 0.2s; }
    .choice-btn:hover { background: #2a2a5a; border-color: #6060ff; color: #fff; }
    .choice-btn:active { background: #3535aa; }
    .timeline-header { padding: 12px 16px 10px; font-size: 12px; color: #666; letter-spacing: 2px; border-bottom: 1px solid #1e1e3a; background: #0f0f1a; flex-shrink: 0; }
    .post-card { padding: 14px 16px; border-bottom: 1px solid #1e1e3a; animation: slideInLeft 0.35s ease; background: #1a1a2e; }
    .post-card.hana { background: #160a28; border-bottom-color: #2a1048; }
    .post-content { font-size: 14px; line-height: 1.75; color: #ddd; margin-bottom: 11px; word-break: break-all; }
    .post-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .like-count { font-size: 12px; color: #666; }
    .post-actions { display: flex; gap: 8px; }
    .like-btn { background: #2a1a3a; border: 1px solid #4a2a5a; color: #ff7aaa; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: background 0.2s, border-color 0.2s; white-space: nowrap; }
    .like-btn:hover { background: #3a1a4a; border-color: #ff7aaa; }
    .like-btn.liked { background: #3a1a4a; border-color: #ff7aaa; opacity: 0.8; cursor: default; }
    .skip-btn { background: #1a1a28; border: 1px solid #2a2a4a; color: #666; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: background 0.2s, color 0.2s; white-space: nowrap; }
    .skip-btn:hover { background: #252535; color: #999; }
    .skip-btn.skipped { color: #333; cursor: default; }
    .narration { padding: 28px 22px; text-align: center; color: #bbb; font-size: 14px; line-height: 2.1; animation: fadeInUp 0.5s ease; }
    .narration-tag { font-size: 11px; color: #555; letter-spacing: 3px; margin-bottom: 18px; }
    .hana-timeline-header { text-align: center; padding: 16px; color: #c080ff; font-size: 13px; font-weight: 700; letter-spacing: 3px; border-bottom: 1px solid #3a1a5a; background: #120820; flex-shrink: 0; animation: fadeInUp 0.4s ease; }
    .end-screen { padding: 32px 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; animation: fadeInUp 0.6s ease; }
    .end-tag { font-size: 11px; color: #555; letter-spacing: 3px; margin-bottom: 24px; }
    .end-text { font-size: 15px; line-height: 2.3; color: #ccc; }
    .bias-section { padding: 24px 18px 8px; border-top: 1px solid #2a2a4a; animation: fadeInUp 0.5s ease; }
    .bias-title { font-size: 12px; color: #777; margin-bottom: 20px; text-align: center; letter-spacing: 2px; }
    .bias-item { margin-bottom: 16px; }
    .bias-label-row { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; margin-bottom: 6px; }
    .bias-bar-bg { background: #111128; border-radius: 4px; height: 10px; overflow: hidden; }
    .bias-bar-fill { height: 100%; border-radius: 4px; width: 0%; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }
    .bias-bar-fill.empathy { background: linear-gradient(90deg,#e84891,#ff9abc); }
    .bias-bar-fill.shock { background: linear-gradient(90deg,#e84020,#ff8800); }
    .bias-bar-fill.diversity { background: linear-gradient(90deg,#4480ff,#8860ff); }
    .next-btn { display: block; width: calc(100% - 32px); margin: 16px auto; background: #3535e0; border: none; color: #fff; padding: 14px; border-radius: 12px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    .next-btn:hover { background: #5050ff; }
    .next-btn:active { background: #2525b0; }
    .title-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; gap: 16px; animation: fadeInUp 0.6s ease; }
    .title-main { font-size: 48px; font-weight: 700; color: #fff; letter-spacing: 6px; }
    .title-sub { font-size: 12px; color: #555; letter-spacing: 3px; margin-top: -8px; }
    .title-desc { font-size: 13px; color: #888; line-height: 1.9; margin-top: 12px; }
    .title-caution { font-size: 11px; color: #444; line-height: 1.8; margin-top: 8px; border-top: 1px solid #222; padding-top: 16px; width: 100%; }
    .start-btn { margin-top: 12px; width: 100%; background: #4040e8; border: none; color: #fff; padding: 15px; border-radius: 14px; font-size: 15px; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; cursor: pointer; letter-spacing: 2px; transition: background 0.2s; }
    .start-btn:hover { background: #5555ff; }
    .video-screen { padding: 0; display: flex; flex-direction: column; animation: fadeInUp 0.4s ease; }
    .video-player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; cursor: pointer; flex-shrink: 0; }
    .video-scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: #0a0a0a; }
    .video-scene-text { font-size: 13px; color: #ccc; text-align: center; line-height: 1.9; opacity: 0; transition: opacity 0.5s ease; white-space: pre-line; }
    .video-scene-text.visible { opacity: 1; }
    .video-thumb { position: absolute; inset: 0; background: linear-gradient(160deg,#1a1a2e 0%,#0a0a14 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.4s ease; }
    .video-thumb-title { font-size: 12px; color: #aaa; text-align: center; padding: 0 20px; line-height: 1.6; }
    .play-btn-big { width: 52px; height: 52px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.3); transition: background 0.2s; }
    .play-btn-big::after { content: ''; width: 0; height: 0; border-style: solid; border-width: 10px 0 10px 18px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
    .video-player:hover .play-btn-big { background: rgba(255,255,255,0.25); }
    .video-progress-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.15); }
    .video-progress-fill { height: 100%; background: #ff4040; width: 0%; transition: width 0.1s linear; }
    .video-meta { padding: 12px 14px; background: #111118; border-bottom: 1px solid #1e1e3a; }
    .video-meta-title { font-size: 13px; color: #ddd; line-height: 1.5; margin-bottom: 6px; }
    .video-meta-sub { font-size: 11px; color: #555; display: flex; gap: 12px; }
    .video-cut-notice { background: #1e0a0a; border-left: 3px solid #ff4040; padding: 10px 14px; font-size: 12px; color: #cc7070; line-height: 1.6; margin: 0; display: none; animation: fadeInUp 0.4s ease; }
    .video-cut-notice.show { display: block; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideInLeft { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }
    @media (max-width:430px) { body { padding:0; align-items:stretch; } #phone { width:100%; min-height:100vh; max-height:100vh; border-radius:0; } }
  </style>
</head>
<body>
<div id="phone">
  <div id="status-bar">
    <span id="day-label">既読</span>
    <span id="part-label">START</span>
  </div>
  <div id="content"></div>
</div>
<script>
let empathyScore=0,shockScore=0,diversityScore=0,hanaTimelineRead=false;
const content=document.getElementById('content'),dayLabel=document.getElementById('day-label'),partLabel=document.getElementById('part-label');
function setStatus(d,p){dayLabel.textContent=d;partLabel.textContent=p;}
function clearContent(){content.innerHTML='';content.scrollTop=0;}
function scrollBottom(){content.scrollTop=content.scrollHeight;}
function showTitle(){setStatus('既読','START');clearContent();const s=document.createElement('div');s.className='title-screen';s.innerHTML=`<div class="title-main">既読</div><div class="title-sub">フィルターバブル体験ゲーム</div><div class="title-desc">同じ事件を、みんなが同じように<br>見ているとは限らない。<br>あなたのタイムラインが、<br>あなたの世界を作っている。</div><div class="title-caution">※ このゲームはフィクションです。<br>ネットいじめ・炎上を肯定する内容ではありません。<br>探究授業での体験・議論を目的としています。</div>`;const b=document.createElement('button');b.className='start-btn';b.textContent='はじめる';b.onclick=showDay1School;s.appendChild(b);content.appendChild(s);}
function appendNextBtn(label,nextFn){const b=document.createElement('button');b.className='next-btn';b.textContent=label;b.onclick=nextFn;content.appendChild(b);scrollBottom();}
function appendPlayerBubble(area,text){const m=document.createElement('div');m.className='chat-meta right';const b=document.createElement('div');b.className='chat-bubble player';b.textContent=text;m.appendChild(b);area.appendChild(m);scrollBottom();}
function appendOtherBubble(area,name,text){const m=document.createElement('div');m.className='chat-meta';const n=document.createElement('div');n.className='chat-name';n.textContent=name;const b=document.createElement('div');b.className='chat-bubble other';b.textContent=text;m.appendChild(n);m.appendChild(b);area.appendChild(m);scrollBottom();}
function showVideo(nextFn){setStatus('Day 1','動画');clearContent();const scenes=['教室。\n先生が黒板に問題を書いている。','田中くんが\n何かをつぶやく。','クラスがざわめく。\n笑い声が聞こえる。','先生が振り返り、\n大きな声で怒鳴る。','───','[ ここで動画は切れている ]'];const w=document.createElement('div');w.className='video-screen';const player=document.createElement('div');player.className='video-player';const thumb=document.createElement('div');thumb.className='video-thumb';thumb.innerHTML='<div class="video-thumb-title">【授業中】田中くんの問題行動が<br>やばすぎる… #切り抜き</div><div class="play-btn-big"></div>';const scene=document.createElement('div');scene.className='video-scene';const sceneText=document.createElement('div');sceneText.className='video-scene-text';scene.appendChild(sceneText);const pw=document.createElement('div');pw.className='video-progress-wrap';const pf=document.createElement('div');pf.className='video-progress-fill';pw.appendChild(pf);player.appendChild(thumb);player.appendChild(scene);player.appendChild(pw);const meta=document.createElement('div');meta.className='video-meta';meta.innerHTML='<div class="video-meta-title">【授業中】田中くんの問題行動がやばすぎる… 切り抜き【閲覧注意】</div><div class="video-meta-sub"><span>👁 38,412 回視聴</span><span>2日前</span></div>';const cut=document.createElement('div');cut.className='video-cut-notice';cut.textContent='⚠ この動画は切り抜きです。前後の映像は含まれていません。';w.appendChild(player);w.appendChild(meta);w.appendChild(cut);content.appendChild(w);let playing=false;player.onclick=()=>{if(playing)return;playing=true;thumb.style.opacity='0';thumb.style.pointerEvents='none';const tot=scenes.length*1400;let el=0;const iv=setInterval(()=>{el+=80;pf.style.width=Math.min((el/tot)*100,100)+'%';if(el>=tot)clearInterval(iv);},80);scenes.forEach((t,i)=>{setTimeout(()=>{sceneText.classList.remove('visible');setTimeout(()=>{sceneText.textContent=t;sceneText.classList.add('visible');},200);if(i===scenes.length-1)setTimeout(()=>{cut.classList.add('show');appendNextBtn('SNSを見る ▶',nextFn);scrollBottom();},1000);},i*1400);});};scrollBottom();}
function showDay1School(){setStatus('Day 1','学校');clearContent();const area=document.createElement('div');area.className='chat-area';content.appendChild(area);appendOtherBubble(area,'Hana（花）','ねえ聞いた？田中くんの動画、ちょっとやばくない？');setTimeout(()=>{const ca=document.createElement('div');ca.className='choice-area';const l=document.createElement('div');l.className='choice-label';l.textContent='あなたの返答は？';const bA=document.createElement('button');bA.className='choice-btn';bA.textContent='A「どんな動画？気になる」';bA.onclick=()=>{shockScore+=1;appendPlayerBubble(area,'どんな動画？気になる');ca.remove();setTimeout(()=>showVideo(showDay1SNS),900);};const bB=document.createElement('button');bB.className='choice-btn';bB.textContent='B「あんまり人の噂話は…」';bB.onclick=()=>{diversityScore+=1;appendPlayerBubble(area,'あんまり人の噂話は…');ca.remove();setTimeout(()=>{appendOtherBubble(area,'Hana（花）','まあとりあえずこれ見てよ 🙄');setTimeout(()=>showVideo(showDay1SNS),800);},700);};ca.appendChild(l);ca.appendChild(bA);ca.appendChild(bB);content.appendChild(ca);scrollBottom();},700);}
function createTimeline(posts,onAllDone){const h=document.createElement('div');h.className='timeline-header';h.textContent='タイムライン';content.appendChild(h);let done=0;posts.forEach((post,i)=>{setTimeout(()=>{const card=document.createElement('div');card.className='post-card';const pc=document.createElement('div');pc.className='post-content';pc.textContent=post.text;const footer=document.createElement('div');footer.className='post-footer';const lc=document.createElement('div');lc.className='like-count';lc.textContent='❤ '+post.likes.toLocaleString();const acts=document.createElement('div');acts.className='post-actions';let inter=false;const lb=document.createElement('button');lb.className='like-btn';lb.textContent='いいね❤️';const sb=document.createElement('button');sb.className='skip-btn';sb.textContent='スキップ▶';lb.onclick=()=>{if(inter)return;inter=true;lb.classList.add('liked');lb.disabled=true;sb.disabled=true;sb.classList.add('skipped');if(post.type==='empathy')empathyScore+=2;else if(post.type==='shock')shockScore+=2;else if(post.type==='diversity')diversityScore+=3;done++;if(done===posts.length)setTimeout(onAllDone,500);};sb.onclick=()=>{if(inter)return;inter=true;sb.classList.add('skipped');sb.disabled=true;lb.disabled=true;if(post.type==='empathy')empathyScore=Math.max(0,empathyScore-1);else if(post.type==='shock')shockScore=Math.max(0,shockScore-1);else if(post.type==='diversity')diversityScore=Math.max(0,diversityScore-1);done++;if(done===posts.length)setTimeout(onAllDone,500);};acts.appendChild(lb);acts.appendChild(sb);footer.appendChild(lc);footer.appendChild(acts);card.appendChild(pc);card.appendChild(footer);content.appendChild(card);scrollBottom();},i*350);});}
function showDay1SNS(){setStatus('Day 1','SNS');clearContent();createTimeline([{text:'田中くんの授業中の動画見た？笑えないんだけど🔥 #炎上 #学校裏垢',likes:142,type:'shock'},{text:'田中くんのことよく知らないけど、あの動画一方的すぎない？かわいそう',likes:38,type:'empathy'},{text:'切り抜き動画って前後の文脈省いてること多いから注意。本当のことわからなくない？',likes:12,type:'diversity'}],()=>{appendNextBtn('Day 2 へ ▶',showDay2School);});}
function showDay2School(){setStatus('Day 2','学校');clearContent();const area=document.createElement('div');area.className='chat-area';content.appendChild(area);appendOtherBubble(area,'Hana（花）','田中くん、やっぱりやばいよ。みんなそう言ってるもん');setTimeout(()=>{const ca=document.createElement('div');ca.className='choice-area';const l=document.createElement('div');l.className='choice-label';l.textContent='あなたの返答は？';const bA=document.createElement('button');bA.className='choice-btn';bA.textContent='A「だよね、あの動画ひどかった」';bA.onclick=()=>{shockScore+=2;empathyScore+=1;appendPlayerBubble(area,'だよね、あの動画ひどかった');ca.remove();setTimeout(showDay2SNS,900);};const bB=document.createElement('button');bB.className='choice-btn';bB.textContent='B「でも全部が本当かわからなくない？」';bB.onclick=()=>{diversityScore+=2;appendPlayerBubble(area,'でも全部が本当かわからなくない？');ca.remove();setTimeout(showDay2SNS,900);};ca.appendChild(l);ca.appendChild(bA);ca.appendChild(bB);content.appendChild(ca);scrollBottom();},700);}
function showDay2SNS(){setStatus('Day 2','SNS');clearContent();const filtered=(empathyScore+shockScore)>diversityScore;createTimeline(filtered?[{text:'田中くん学校来たらしい。被害者の気持ちわかるの？',likes:203,type:'shock'},{text:'擁護してる人、同類じゃないの',likes:87,type:'shock'},{text:'切り抜き動画のフルver見た？やっぱりひどい',likes:156,type:'empathy'}]:[{text:'どっちの言い分も聞かないで判断するのこわい',likes:34,type:'diversity'},{text:'クラスの空気って怖いよね。一気に変わる',likes:28,type:'diversity'},{text:'SNSで人を裁く文化マジで終わってほしい',likes:19,type:'diversity'}],()=>{appendNextBtn('Day 3 へ ▶',showDay3School);});}
function showDay3School(){setStatus('Day 3','学校');clearContent();const area=document.createElement('div');area.className='chat-area';content.appendChild(area);appendOtherBubble(area,'Hana（花）','なんで田中くんの肩持つの？おかしくない？');setTimeout(()=>{const ca=document.createElement('div');ca.className='choice-area';const l=document.createElement('div');l.className='choice-label';l.textContent='あなたの返答は？';const bA=document.createElement('button');bA.className='choice-btn';bA.textContent='A「ごめん、確かにやばいかもね」';bA.onclick=()=>{empathyScore+=2;shockScore+=1;appendPlayerBubble(area,'ごめん、確かにやばいかもね');ca.remove();setTimeout(showEndJudge,900);};const bB=document.createElement('button');bB.className='choice-btn';bB.textContent='B「でも俺/私が見た情報と違う…」';bB.onclick=()=>{diversityScore+=2;appendPlayerBubble(area,'でも俺/私が見た情報と違う…');ca.remove();setTimeout(showHanaTimeline,900);};ca.appendChild(l);ca.appendChild(bA);ca.appendChild(bB);content.appendChild(ca);scrollBottom();},700);}
function showHanaTimeline(){setStatus('Day 3','Hanaの画面');clearContent();const hh=document.createElement('div');hh.className='hana-timeline-header';hh.textContent='─── Hanaのタイムライン ───';content.appendChild(hh);const posts=[{text:'被害者の子、泣いてたって聞いた。田中くん最低',likes:412},{text:'擁護コメントしてる人たちって何なの',likes:234},{text:'学校側が動かないなら拡散するしかない',likes:189}];posts.forEach((p,i)=>{setTimeout(()=>{const card=document.createElement('div');card.className='post-card hana';const pc=document.createElement('div');pc.className='post-content';pc.textContent=p.text;const lc=document.createElement('div');lc.className='like-count';lc.textContent='❤ '+p.likes.toLocaleString();card.appendChild(pc);card.appendChild(lc);content.appendChild(card);scrollBottom();if(i===posts.length-1)setTimeout(()=>{hanaTimelineRead=true;diversityScore+=5;const n=document.createElement('div');n.className='narration';n.innerHTML='<div class="narration-tag">── ナレーション ──</div><p>Hanaが見ていた世界は、<br>あなたの見ていた世界と違った。</p><br><p>同じ事件なのに。<br>同じクラスなのに。</p>';content.appendChild(n);appendNextBtn('続ける ▶',showEndJudge);},700);},i*450);});}
function showEndJudge(){if((empathyScore+shockScore)>diversityScore*2)showDivisionEnd();else showDialogueEnd();}
function showDivisionEnd(){setStatus('結末','分断エンド');clearContent();const s=document.createElement('div');s.className='end-screen';s.innerHTML='<div class="end-tag">─── 7日後 ───</div><div class="end-text">田中くんはクラスに来なくなった。<br><br>Hanaとはもう話していない。<br><br>あなたのタイムラインは今日も、<br>あなたの知っている世界だけを<br>映している。</div>';content.appendChild(s);setTimeout(showBiasVisualization,900);}
function showDialogueEnd(){setStatus('結末','対話エンド');clearContent();const s=document.createElement('div');s.className='end-screen';s.innerHTML='<div class="end-tag">─── 7日後 ───</div><div class="end-text">田中くんの話、<br>ちゃんと聞けた気がした。<br><br>Hanaとも、少しだけ話せた。<br><br>世界が広がるのは、<br>ちょっと疲れる。<br>でも、悪くなかった。</div>';content.appendChild(s);setTimeout(showBiasVisualization,900);}
function showBiasVisualization(){const total=empathyScore+shockScore+diversityScore;const ep=total>0?Math.round(empathyScore/total*100):33;const sp=total>0?Math.round(shockScore/total*100):34;const dp=total>0?Math.round(diversityScore/total*100):33;const sec=document.createElement('div');sec.className='bias-section';const t=document.createElement('div');t.className='bias-title';t.textContent='あなたのタイムラインの偏り';sec.appendChild(t);function bar(label,pct,cls){const item=document.createElement('div');item.className='bias-item';const lr=document.createElement('div');lr.className='bias-label-row';lr.innerHTML=`<span>${label}</span><span>${pct}%</span>`;const bg=document.createElement('div');bg.className='bias-bar-bg';const fill=document.createElement('div');fill.className='bias-bar-fill '+cls;fill.style.width='0%';bg.appendChild(fill);item.appendChild(lr);item.appendChild(bg);setTimeout(()=>{fill.style.width=pct+'%';},150);return item;}sec.appendChild(bar('共感系コンテンツ',ep,'empathy'));sec.appendChild(bar('炎上系コンテンツ',sp,'shock'));sec.appendChild(bar('多様性コンテンツ',dp,'diversity'));const c=document.createElement('div');c.style.cssText='font-size:12px;color:#555;text-align:center;margin:20px 4px 8px;line-height:1.8;';c.textContent=(empathyScore+shockScore)>diversityScore*2?'あなたのフィードは同じ方向の声で満ちていた。これがフィルターバブルの正体です。':'複数の視点に触れたあなたは、バブルの外を少し覗けていた。';sec.appendChild(c);const rb=document.createElement('button');rb.className='next-btn';rb.textContent='もう一度プレイ';rb.style.marginTop='12px';rb.onclick=()=>{empathyScore=0;shockScore=0;diversityScore=0;hanaTimelineRead=false;showTitle();};sec.appendChild(rb);content.appendChild(sec);scrollBottom();}
showTitle();
</script>
