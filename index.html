<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>既読 — フィルターバブル体験ゲーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       グローバルリセット・基本スタイル
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
      color: #fff;
      padding: 20px 0;
    }

    /* ============================================
       スマホ画面モック本体
       幅390px・中央寄せで実機に近い見た目を再現
    ============================================ */
    #phone {
      width: 390px;
      min-height: 700px;
      max-height: 90vh;
      background: #1a1a2e;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 0 2px #2a2a4a,
        0 0 80px rgba(100, 100, 255, 0.15);
      position: relative;
    }

    /* ============================================
       ステータスバー（Day・パート表示 — 常時表示）
    ============================================ */
    #status-bar {
      background: #0f0f1a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
      min-height: 48px;
    }

    #day-label {
      font-size: 13px;
      font-weight: 700;
      color: #7c7cff;
      letter-spacing: 2px;
    }

    #part-label {
      font-size: 11px;
      color: #888;
      background: #222;
      padding: 4px 10px;
      border-radius: 10px;
      letter-spacing: 1px;
    }

    /* ============================================
       メインコンテンツエリア（JSで動的に書き換え）
    ============================================ */
    #content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: #2a2a4a transparent;
    }

    #content::-webkit-scrollbar { width: 4px; }
    #content::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

    /* ============================================
       学校パート — チャットUI
    ============================================ */
    .chat-area {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-meta.right {
      align-items: flex-end;
    }

    .chat-name {
      font-size: 11px;
      color: #888;
      padding: 0 4px;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.7;
      animation: fadeInUp 0.35s ease;
    }

    .chat-bubble.other {
      background: #252545;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.player {
      background: #4040e8;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* 選択肢エリア */
    .choice-area {
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeInUp 0.4s ease;
    }

    .choice-label {
      font-size: 11px;
      color: #666;
      letter-spacing: 1px;
      padding: 0 4px;
      margin-bottom: 4px;
    }

    .choice-btn {
      background: #1e1e3a;
      border: 1px solid #3a3a6a;
      color: #ddd;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      text-align: left;
      line-height: 1.6;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .choice-btn:hover {
      background: #2a2a5a;
      border-color: #6060ff;
      color: #fff;
    }

    .choice-btn:active {
      background: #3535aa;
    }

    /* ============================================
       SNSタイムライン — カード型UI
    ============================================ */
    .timeline-header {
      padding: 12px 16px 10px;
      font-size: 12px;
      color: #666;
      letter-spacing: 2px;
      border-bottom: 1px solid #1e1e3a;
      background: #0f0f1a;
      flex-shrink: 0;
    }

    .post-card {
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e3a;
      animation: slideInLeft 0.35s ease;
      background: #1a1a2e;
    }

    .post-card.hana {
      background: #160a28;
      border-bottom-color: #2a1048;
    }

    .post-content {
      font-size: 14px;
      line-height: 1.75;
      color: #ddd;
      margin-bottom: 11px;
      word-break: break-all;
    }

    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .like-count {
      font-size: 12px;
      color: #666;
    }

    .post-actions {
      display: flex;
      gap: 8px;
    }

    .like-btn {
      background: #2a1a3a;
      border: 1px solid #4a2a5a;
      color: #ff7aaa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .like-btn:hover {
      background: #3a1a4a;
      border-color: #ff7aaa;
    }

    .like-btn.liked {
      background: #3a1a4a;
      border-color: #ff7aaa;
      opacity: 0.8;
      cursor: default;
    }

    .skip-btn {
      background: #1a1a28;
      border: 1px solid #2a2a4a;
      color: #666;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .skip-btn:hover {
      background: #252535;
      color: #999;
    }

    .skip-btn.skipped {
      color: #333;
      cursor: default;
    }

    /* ============================================
       ナレーション・区切り表示
    ============================================ */
    .narration {
      padding: 28px 22px;
      text-align: center;
      color: #bbb;
      font-size: 14px;
      line-height: 2.1;
      animation: fadeInUp 0.5s ease;
    }

    .narration-tag {
      font-size: 11px;
      color: #555;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    /* Hanaタイムラインの特殊ヘッダー */
    .hana-timeline-header {
      text-align: center;
      padding: 16px;
      color: #c080ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      border-bottom: 1px solid #3a1a5a;
      background: #120820;
      flex-shrink: 0;
      animation: fadeInUp 0.4s ease;
    }

    /* ============================================
       エンド画面
    ============================================ */
    .end-screen {
      padding: 32px 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }

    .end-tag {
      font-size: 11px;
      color: #555;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }

    .end-text {
      font-size: 15px;
      line-height: 2.3;
      color: #ccc;
    }

    /* ============================================
       偏り可視化バーグラフ
    ============================================ */
    .bias-section {
      padding: 24px 18px 8px;
      border-top: 1px solid #2a2a4a;
      animation: fadeInUp 0.5s ease;
    }

    .bias-title {
      font-size: 12px;
      color: #777;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    .bias-item {
      margin-bottom: 16px;
    }

    .bias-label-row {
      font-size: 12px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .bias-bar-bg {
      background: #111128;
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
    }

    .bias-bar-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bias-bar-fill.empathy   { background: linear-gradient(90deg, #e84891, #ff9abc); }
    .bias-bar-fill.shock     { background: linear-gradient(90deg, #e84020, #ff8800); }
    .bias-bar-fill.diversity { background: linear-gradient(90deg, #4480ff, #8860ff); }

    /* ============================================
       汎用「次へ」ボタン
    ============================================ */
    .next-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 16px auto;
      background: #3535e0;
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .next-btn:hover  { background: #5050ff; }
    .next-btn:active { background: #2525b0; }

    /* ============================================
       タイトル画面
    ============================================ */
    .title-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 16px;
      animation: fadeInUp 0.6s ease;
    }

    .title-main {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 6px;
    }

    .title-sub {
      font-size: 12px;
      color: #555;
      letter-spacing: 3px;
      margin-top: -8px;
    }

    .title-desc {
      font-size: 13px;
      color: #888;
      line-height: 1.9;
      margin-top: 12px;
    }

    .title-caution {
      font-size: 11px;
      color: #444;
      line-height: 1.8;
      margin-top: 8px;
      border-top: 1px solid #222;
      padding-top: 16px;
      width: 100%;
    }

    .start-btn {
      margin-top: 12px;
      width: 100%;
      background: #4040e8;
      border: none;
      color: #fff;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.2s;
    }

    .start-btn:hover { background: #5555ff; }

    /* ============================================
       アニメーション定義
    ============================================ */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ============================================
       スマホ実機でのフルスクリーン対応
    ============================================ */
    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      #phone {
        width: 100%;
        min-height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

<!-- ============================================
     スマホ画面モック
============================================ -->
<div id="phone">

  <!-- ステータスバー：Day・パートを常時表示 -->
  <div id="status-bar">
    <span id="day-label">既読</span>
    <span id="part-label">START</span>
  </div>

  <!-- メインコンテンツ（JSが動的に書き換える） -->
  <div id="content"></div>

</div><!-- /#phone -->

<script>
/* ============================================
   スコア変数の定義
   プレイヤーには一切表示しない内部変数。
   各行動によって値が変化し、最終エンドと
   偏り可視化グラフに使用される。

   empathyScore  : 共感・同意系コンテンツへの傾き
   shockScore    : 炎上・怒り系コンテンツへの傾き
   diversityScore: 異論・多様性コンテンツへの傾き
============================================ */
let empathyScore   = 0;
let shockScore     = 0;
let diversityScore = 0;

// Hanaのタイムラインを最後まで読んだか（diversityScore +5 の条件）
let hanaTimelineRead = false;

/* ============================================
   DOM参照・ユーティリティ
============================================ */
const content   = document.getElementById('content');
const dayLabel  = document.getElementById('day-label');
const partLabel = document.getElementById('part-label');

function setStatus(day, part) {
  dayLabel.textContent  = day;
  partLabel.textContent = part;
}

function clearContent() {
  content.innerHTML = '';
  content.scrollTop = 0;
}

function scrollBottom() {
  content.scrollTop = content.scrollHeight;
}

/* ============================================
   タイトル画面
============================================ */
function showTitle() {
  setStatus('既読', 'START');
  clearContent();

  const screen = document.createElement('div');
  screen.className = 'title-screen';
  screen.innerHTML = `
    <div class="title-main">既読</div>
    <div class="title-sub">フィルターバブル体験ゲーム</div>
    <div class="title-desc">
      同じ事件を、みんなが同じように<br>
      見ているとは限らない。<br>
      あなたのタイムラインが、<br>あなたの世界を作っている。
    </div>
    <div class="title-caution">
      ※ このゲームはフィクションです。<br>
      ネットいじめ・炎上を肯定する内容ではありません。<br>
      探究授業での体験・議論を目的としています。
    </div>
  `;

  const btn = document.createElement('button');
  btn.className = 'start-btn';
  btn.textContent = 'はじめる';
  btn.onclick = showDay1School;

  screen.appendChild(btn);
  content.appendChild(screen);
}

/* ============================================
   汎用ヘルパー: 「次へ」ボタンを末尾に追加する
============================================ */
function appendNextBtn(label, nextFn) {
  const btn = document.createElement('button');
  btn.className = 'next-btn';
  btn.textContent = label;
  btn.onclick = nextFn;
  content.appendChild(btn);
  scrollBottom();
}

/* ============================================
   汎用ヘルパー: プレイヤー発言バブルをチャットエリアに追加する
============================================ */
function appendPlayerBubble(chatArea, text) {
  const meta = document.createElement('div');
  meta.className = 'chat-meta right';

  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble player';
  bubble.textContent = text;

  meta.appendChild(bubble);
  chatArea.appendChild(meta);
  scrollBottom();
}

/* ============================================
   汎用ヘルパー: 相手キャラのバブルをチャットエリアに追加する
============================================ */
function appendOtherBubble(chatArea, name, text) {
  const meta = document.createElement('div');
  meta.className = 'chat-meta';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'chat-name';
  nameDiv.textContent = name;

  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble other';
  bubble.textContent = text;

  meta.appendChild(nameDiv);
  meta.appendChild(bubble);
  chatArea.appendChild(meta);
  scrollBottom();
}

/* ============================================
   Day1 — 学校パート
============================================ */
function showDay1School() {
  setStatus('Day 1', '学校');
  clearContent();

  const chatArea = document.createElement('div');
  chatArea.className = 'chat-area';
  content.appendChild(chatArea);

  appendOtherBubble(chatArea, 'Hana（花）', 'ねえ聞いた？田中くんの動画、ちょっとやばくない？');

  setTimeout(() => {
    const choiceArea = document.createElement('div');
    choiceArea.className = 'choice-area';

    const label = document.createElement('div');
    label.className = 'choice-label';
    label.textContent = 'あなたの返答は？';

    const btnA = document.createElement('button');
    btnA.className = 'choice-btn';
    btnA.textContent = 'A「どんな動画？気になる」';
    btnA.onclick = () => {
      shockScore += 1; // 炎上・好奇心寄りの選択
      appendPlayerBubble(chatArea, 'どんな動画？気になる');
      choiceArea.remove();
      setTimeout(showDay1SNS, 900);
    };

    const btnB = document.createElement('button');
    btnB.className = 'choice-btn';
    btnB.textContent = 'B「あんまり人の噂話は…」';
    btnB.onclick = () => {
      diversityScore += 1; // 慎重・多様性寄りの選択
      appendPlayerBubble(chatArea, 'あんまり人の噂話は…');
      choiceArea.remove();
      setTimeout(showDay1SNS, 900);
    };

    choiceArea.appendChild(label);
    choiceArea.appendChild(btnA);
    choiceArea.appendChild(btnB);
    content.appendChild(choiceArea);
    scrollBottom();
  }, 700);
}

/* ============================================
   タイムライン生成関数
   posts 配列を受け取り、カード型のSNS投稿UIを順番に生成する。
   各カードには「いいね」「スキップ」ボタンがあり、
   押すと対応するスコアが変動する。
   全投稿にインタラクションしたら onAllDone() を呼ぶ。

   post オブジェクト:
     { text: string, likes: number, type: 'shock'|'empathy'|'diversity' }
============================================ */
function createTimeline(posts, onAllDone) {
  const header = document.createElement('div');
  header.className = 'timeline-header';
  header.textContent = 'タイムライン';
  content.appendChild(header);

  let interactedCount = 0;

  posts.forEach((post, index) => {
    setTimeout(() => {
      const card = document.createElement('div');
      card.className = 'post-card';

      const postContent = document.createElement('div');
      postContent.className = 'post-content';
      postContent.textContent = post.text;

      const footer = document.createElement('div');
      footer.className = 'post-footer';

      const likeCount = document.createElement('div');
      likeCount.className = 'like-count';
      likeCount.textContent = `❤ ${post.likes.toLocaleString()}`;

      const actions = document.createElement('div');
      actions.className = 'post-actions';

      let interacted = false;

      const likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn';
      likeBtn.textContent = 'いいね❤️';

      const skipBtn = document.createElement('button');
      skipBtn.className = 'skip-btn';
      skipBtn.textContent = 'スキップ▶';

      // いいねを押したときのスコア変動
      likeBtn.onclick = () => {
        if (interacted) return;
        interacted = true;
        likeBtn.classList.add('liked');
        likeBtn.disabled = true;
        skipBtn.disabled = true;
        skipBtn.classList.add('skipped');

        if (post.type === 'empathy')        empathyScore   += 2;
        else if (post.type === 'shock')     shockScore     += 2;
        else if (post.type === 'diversity') diversityScore += 3;

        interactedCount++;
        if (interactedCount === posts.length) setTimeout(onAllDone, 500);
      };

      // スキップしたときのスコア変動（該当スコアを微減、0未満にはしない）
      skipBtn.onclick = () => {
        if (interacted) return;
        interacted = true;
        skipBtn.classList.add('skipped');
        skipBtn.disabled = true;
        likeBtn.disabled = true;

        if (post.type === 'empathy')        empathyScore   = Math.max(0, empathyScore   - 1);
        else if (post.type === 'shock')     shockScore     = Math.max(0, shockScore     - 1);
        else if (post.type === 'diversity') diversityScore = Math.max(0, diversityScore - 1);

        interactedCount++;
        if (interactedCount === posts.length) setTimeout(onAllDone, 500);
      };

      actions.appendChild(likeBtn);
      actions.appendChild(skipBtn);
      footer.appendChild(likeCount);
      footer.appendChild(actions);
      card.appendChild(postContent);
      card.appendChild(footer);
      content.appendChild(card);
      scrollBottom();
    }, index * 350);
  });
}

/* ============================================
   Day1 — SNSパート
============================================ */
function showDay1SNS() {
  setStatus('Day 1', 'SNS');
  clearContent();

  const day1Posts = [
    {
      text:  '田中くんの授業中の動画見た？笑えないんだけど🔥 #炎上 #学校裏垢',
      likes: 142,
      type:  'shock'
    },
    {
      text:  '田中くんのことよく知らないけど、あの動画一方的すぎない？かわいそう',
      likes: 38,
      type:  'empathy'
    },
    {
      text:  '切り抜き動画って前後の文脈省いてること多いから注意。本当のことわからなくない？',
      likes: 12,
      type:  'diversity'
    }
  ];

  createTimeline(day1Posts, () => {
    appendNextBtn('Day 2 へ ▶', showDay2School);
  });
}

/* ============================================
   Day2 — 学校パート
============================================ */
function showDay2School() {
  setStatus('Day 2', '学校');
  clearContent();

  const chatArea = document.createElement('div');
  chatArea.className = 'chat-area';
  content.appendChild(chatArea);

  appendOtherBubble(chatArea, 'Hana（花）', '田中くん、やっぱりやばいよ。みんなそう言ってるもん');

  setTimeout(() => {
    const choiceArea = document.createElement('div');
    choiceArea.className = 'choice-area';

    const label = document.createElement('div');
    label.className = 'choice-label';
    label.textContent = 'あなたの返答は？';

    const btnA = document.createElement('button');
    btnA.className = 'choice-btn';
    btnA.textContent = 'A「だよね、あの動画ひどかった」';
    btnA.onclick = () => {
      shockScore   += 2;
      empathyScore += 1;
      appendPlayerBubble(chatArea, 'だよね、あの動画ひどかった');
      choiceArea.remove();
      setTimeout(showDay2SNS, 900);
    };

    const btnB = document.createElement('button');
    btnB.className = 'choice-btn';
    btnB.textContent = 'B「でも全部が本当かわからなくない？」';
    btnB.onclick = () => {
      diversityScore += 2;
      appendPlayerBubble(chatArea, 'でも全部が本当かわからなくない？');
      choiceArea.remove();
      setTimeout(showDay2SNS, 900);
    };

    choiceArea.appendChild(label);
    choiceArea.appendChild(btnA);
    choiceArea.appendChild(btnB);
    content.appendChild(choiceArea);
    scrollBottom();
  }, 700);
}

/* ============================================
   Day2 — SNSパート
   分岐判定ロジック（フィルターバブルの体現）:
   Day1〜2前半のスコアを元にタイムライン内容を変える。
   共感+炎上スコアが多様性スコアを超えている場合、
   より過激・同調的なタイムラインが表示される。
============================================ */
function showDay2SNS() {
  setStatus('Day 2', 'SNS');
  clearContent();

  // フィルターバブル判定：同調圧力スコアが多様性スコアを上回ったか
  const isFilterBubbled = (empathyScore + shockScore) > diversityScore;

  let day2Posts;

  if (isFilterBubbled) {
    // 共感・炎上スコアが高い → 偏ったタイムライン（炎上寄り）
    day2Posts = [
      {
        text:  '田中くん学校来たらしい。被害者の気持ちわかるの？',
        likes: 203,
        type:  'shock'
      },
      {
        text:  '擁護してる人、同類じゃないの',
        likes: 87,
        type:  'shock'
      },
      {
        text:  '切り抜き動画のフルver見た？やっぱりひどい',
        likes: 156,
        type:  'empathy'
      }
    ];
  } else {
    // 多様性スコアが高い → バランスのとれたタイムライン
    day2Posts = [
      {
        text:  'どっちの言い分も聞かないで判断するのこわい',
        likes: 34,
        type:  'diversity'
      },
      {
        text:  'クラスの空気って怖いよね。一気に変わる',
        likes: 28,
        type:  'diversity'
      },
      {
        text:  'SNSで人を裁く文化マジで終わってほしい',
        likes: 19,
        type:  'diversity'
      }
    ];
  }

  createTimeline(day2Posts, () => {
    appendNextBtn('Day 3 へ ▶', showDay3School);
  });
}

/* ============================================
   Day3 — 学校パート（山場）
============================================ */
function showDay3School() {
  setStatus('Day 3', '学校');
  clearContent();

  const chatArea = document.createElement('div');
  chatArea.className = 'chat-area';
  content.appendChild(chatArea);

  appendOtherBubble(chatArea, 'Hana（花）', 'なんで田中くんの肩持つの？おかしくない？');

  setTimeout(() => {
    const choiceArea = document.createElement('div');
    choiceArea.className = 'choice-area';

    const label = document.createElement('div');
    label.className = 'choice-label';
    label.textContent = 'あなたの返答は？';

    const btnA = document.createElement('button');
    btnA.className = 'choice-btn';
    btnA.textContent = 'A「ごめん、確かにやばいかもね」';
    btnA.onclick = () => {
      empathyScore += 2;
      shockScore   += 1;
      appendPlayerBubble(chatArea, 'ごめん、確かにやばいかもね');
      choiceArea.remove();
      // Aを選択 → Hanaのタイムライン表示なし、そのまま結末判定へ
      setTimeout(showEndJudge, 900);
    };

    const btnB = document.createElement('button');
    btnB.className = 'choice-btn';
    btnB.textContent = 'B「でも俺/私が見た情報と違う…」';
    btnB.onclick = () => {
      diversityScore += 2;
      appendPlayerBubble(chatArea, 'でも俺/私が見た情報と違う…');
      choiceArea.remove();
      // Bを選択 → 強制的にHanaのタイムラインを表示するイベントが発生
      setTimeout(showHanaTimeline, 900);
    };

    choiceArea.appendChild(label);
    choiceArea.appendChild(btnA);
    choiceArea.appendChild(btnB);
    content.appendChild(choiceArea);
    scrollBottom();
  }, 700);
}

/* ============================================
   Hanaのタイムライン（強制表示イベント）
   Day3でBを選んだ場合のみ発生する演出。
   「Hanaが見ていた世界」を別タイムラインとして表示し、
   プレイヤーに情報の非対称性・フィルターバブルを体感させる。
   最後まで読むと diversityScore +5 を付与する。
============================================ */
function showHanaTimeline() {
  setStatus('Day 3', 'Hanaの画面');
  clearContent();

  const hanaHeader = document.createElement('div');
  hanaHeader.className = 'hana-timeline-header';
  hanaHeader.textContent = '─── Hanaのタイムライン ───';
  content.appendChild(hanaHeader);

  const hanaPosts = [
    { text: '被害者の子、泣いてたって聞いた。田中くん最低', likes: 412 },
    { text: '擁護コメントしてる人たちって何なの',           likes: 234 },
    { text: '学校側が動かないなら拡散するしかない',         likes: 189 }
  ];

  hanaPosts.forEach((post, index) => {
    setTimeout(() => {
      const card = document.createElement('div');
      card.className = 'post-card hana';

      const postContent = document.createElement('div');
      postContent.className = 'post-content';
      postContent.textContent = post.text;

      const likeCount = document.createElement('div');
      likeCount.className = 'like-count';
      likeCount.textContent = `❤ ${post.likes.toLocaleString()}`;

      card.appendChild(postContent);
      card.appendChild(likeCount);
      content.appendChild(card);
      scrollBottom();

      // 最後の投稿を表示後、ナレーションと次へボタンを追加
      if (index === hanaPosts.length - 1) {
        setTimeout(() => {
          hanaTimelineRead = true;
          diversityScore += 5; // 異なる視点を最後まで読んだ報酬

          const narr = document.createElement('div');
          narr.className = 'narration';
          narr.innerHTML = `
            <div class="narration-tag">── ナレーション ──</div>
            <p>Hanaが見ていた世界は、<br>あなたの見ていた世界と違った。</p>
            <br>
            <p>同じ事件なのに。<br>同じクラスなのに。</p>
          `;
          content.appendChild(narr);
          appendNextBtn('続ける ▶', showEndJudge);
        }, 700);
      }
    }, index * 450);
  });
}

/* ============================================
   分岐判定ロジック（エンド分岐）
   empathyScore + shockScore > diversityScore × 2 → 分断エンド
   それ以外                                       → 対話エンド

   「炎上・同調への引力が多様性への意識の2倍を超えたか」で判定する。
============================================ */
function showEndJudge() {
  if ((empathyScore + shockScore) > diversityScore * 2) {
    showDivisionEnd();
  } else {
    showDialogueEnd();
  }
}

/* ============================================
   エンド演出 — 分断エンド
   フィルターバブルに飲み込まれ、関係が断絶する結末
============================================ */
function showDivisionEnd() {
  setStatus('結末', '分断エンド');
  clearContent();

  const screen = document.createElement('div');
  screen.className = 'end-screen';
  screen.innerHTML = `
    <div class="end-tag">─── 7日後 ───</div>
    <div class="end-text">
      田中くんはクラスに来なくなった。<br>
      <br>
      Hanaとはもう話していない。<br>
      <br>
      あなたのタイムラインは今日も、<br>
      あなたの知っている世界だけを<br>
      映している。
    </div>
  `;
  content.appendChild(screen);

  setTimeout(showBiasVisualization, 900);
}

/* ============================================
   エンド演出 — 対話エンド
   複数の視点を受け止め、対話へと踏み出せた結末
============================================ */
function showDialogueEnd() {
  setStatus('結末', '対話エンド');
  clearContent();

  const screen = document.createElement('div');
  screen.className = 'end-screen';
  screen.innerHTML = `
    <div class="end-tag">─── 7日後 ───</div>
    <div class="end-text">
      田中くんの話、<br>ちゃんと聞けた気がした。<br>
      <br>
      Hanaとも、少しだけ話せた。<br>
      <br>
      世界が広がるのは、<br>ちょっと疲れる。<br>
      でも、悪くなかった。
    </div>
  `;
  content.appendChild(screen);

  setTimeout(showBiasVisualization, 900);
}

/* ============================================
   偏り可視化の計算部分
   3スコアの合計を分母として各割合（%）を算出し、
   CSSトランジションで伸びるバーグラフとして表示する。
   合計が0の場合はゼロ除算を防ぐため均等割りにする。
============================================ */
function showBiasVisualization() {
  const total = empathyScore + shockScore + diversityScore;

  // 各スコアをパーセンテージに変換
  const empathyPct   = total > 0 ? Math.round((empathyScore   / total) * 100) : 33;
  const shockPct     = total > 0 ? Math.round((shockScore     / total) * 100) : 34;
  const diversityPct = total > 0 ? Math.round((diversityScore / total) * 100) : 33;

  const section = document.createElement('div');
  section.className = 'bias-section';

  const title = document.createElement('div');
  title.className = 'bias-title';
  title.textContent = 'あなたのタイムラインの偏り';
  section.appendChild(title);

  // バーアイテムを生成するローカルヘルパー
  function makeBiasBar(label, pct, colorClass) {
    const item = document.createElement('div');
    item.className = 'bias-item';

    const labelRow = document.createElement('div');
    labelRow.className = 'bias-label-row';
    labelRow.innerHTML = `<span>${label}</span><span>${pct}%</span>`;

    const barBg = document.createElement('div');
    barBg.className = 'bias-bar-bg';

    const barFill = document.createElement('div');
    barFill.className = `bias-bar-fill ${colorClass}`;
    barFill.style.width = '0%';

    barBg.appendChild(barFill);
    item.appendChild(labelRow);
    item.appendChild(barBg);

    // 描画後に width をセットすることで CSS トランジションを発火させる
    setTimeout(() => { barFill.style.width = pct + '%'; }, 150);

    return item;
  }

  section.appendChild(makeBiasBar('共感系コンテンツ', empathyPct,   'empathy'));
  section.appendChild(makeBiasBar('炎上系コンテンツ', shockPct,     'shock'));
  section.appendChild(makeBiasBar('多様性コンテンツ', diversityPct, 'diversity'));

  // エンド別のひとことコメント
  const comment = document.createElement('div');
  comment.style.cssText = 'font-size:12px;color:#555;text-align:center;margin:20px 4px 8px;line-height:1.8;';
  if ((empathyScore + shockScore) > diversityScore * 2) {
    comment.textContent = 'あなたのフィードは同じ方向の声で満ちていた。\nこれがフィルターバブルの正体です。';
  } else {
    comment.textContent = '複数の視点に触れたあなたは、バブルの外を少し覗けていた。';
  }
  section.appendChild(comment);

  // もう一度プレイするボタン
  const replayBtn = document.createElement('button');
  replayBtn.className = 'next-btn';
  replayBtn.textContent = 'もう一度プレイ';
  replayBtn.style.marginTop = '12px';
  replayBtn.onclick = () => {
    // スコアを全リセット
    empathyScore     = 0;
    shockScore       = 0;
    diversityScore   = 0;
    hanaTimelineRead = false;
    showTitle();
  };
  section.appendChild(replayBtn);

  content.appendChild(section);
  scrollBottom();
}

/* ============================================
   ゲーム起動 — タイトル画面を表示する
============================================ */
showTitle();
</script>
</body>
</html>
