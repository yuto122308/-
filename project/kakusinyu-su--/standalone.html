<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>バズれ。</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>/* style.css */
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --bg: #050814;
  --bg-soft: #0c1020;
  --accent: #ff2f6b;
  --accent-soft: rgba(255, 47, 107, 0.2);
  --text: #f7f7ff;
  --muted: #9ca3af;
  --good: #22c55e;
  --bad: #f97316;
  --danger: #ef4444;
  --border: #1f2933;
  --card-radius: 18px;
  --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.45);
  --transition-fast: 0.18s ease-out;
  --transition-med: 0.25s ease-out;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  background: radial-gradient(circle at top, #1b1f3b 0, #050814 55%, #020308 100%);
  color: var(--text);
  height: 100%;
}

body {
  display: flex;
  justify-content: center;
  align-items: stretch;
}

#app {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 12px;
}

/* 共通スクリーン */
.screen {
  display: none;
  width: 100%;
  align-items: center;
  justify-content: center;
}

.screen.active {
  display: flex;
}

/* タイトル画面 */
#title-screen {
  flex-direction: column;
  text-align: center;
  gap: 24px;
}

.title-logo {
  font-size: 3.2rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: none;
  padding: 12px 24px;
  border-radius: 999px;
  border: 2px solid var(--accent);
  box-shadow: 0 0 40px rgba(255, 47, 107, 0.4);
  background: radial-gradient(circle at top, #2b1630, #050814);
}

.title-logo.small {
  font-size: 2rem;
  box-shadow: none;
}

.title-sub {
  font-size: 0.95rem;
  color: var(--muted);
}

.primary-btn {
  border: none;
  outline: none;
  padding: 14px 26px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff2f6b, #ff7a3c);
  color: white;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
  transform: translateY(0);
  transition: transform var(--transition-fast), box-shadow var(--transition-fast),
    filter var(--transition-fast);
}

.primary-btn:active {
  transform: translateY(2px) scale(0.98);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
  filter: brightness(0.95);
}

/* ゲーム画面 */
#game-screen {
  flex-direction: column;
  gap: 10px;
}

/* 上部バー */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(5, 8, 20, 0.9);
  border-radius: 999px;
  padding: 8px 16px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  backdrop-filter: blur(18px);
}

.stat {
  display: flex;
  flex-direction: column;
  min-width: 70px;
}

.stat-label {
  font-size: 0.65rem;
  color: var(--muted);
}

.stat-value {
  font-size: 0.95rem;
  font-weight: 700;
}

.stat-value.big {
  font-size: 1.4rem;
}

/* メインレイアウト */
.main-container {
  flex: 1;
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

/* 左カラム */
.content-column {
  flex: 1.1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 右カラム */
.feed-column {
  flex: 1;
  display: flex;
  justify-content: center;
}

/* カード共通 */
.news-card,
.post-style-card,
.result-panel {
  background: rgba(12, 16, 32, 0.95);
  border-radius: var(--card-radius);
  padding: 14px 16px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  box-shadow: var(--shadow-soft);
}

.news-label,
.post-label {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 6px;
}

.news-text {
  font-size: 1.1rem;
  font-weight: 600;
}

/* 投稿ボタン */
.post-buttons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 4px;
}

.post-btn {
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.4);
  padding: 8px 10px;
  background: rgba(15, 23, 42, 0.9);
  color: var(--text);
  font-size: 0.8rem;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: transform var(--transition-fast),
    box-shadow var(--transition-fast), border-color var(--transition-fast),
    background var(--transition-fast);
}

.post-btn-main {
  font-weight: 600;
}

.post-btn-sub {
  font-size: 0.7rem;
  color: var(--muted);
}

.post-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(15, 23, 42, 0.7);
  border-color: var(--accent);
}

.post-btn:active {
  transform: translateY(1px) scale(0.98);
}

/* 結果パネル */
.result-panel {
  margin-top: 4px;
  min-height: 70px;
}

.result-panel.hidden {
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
}

.result-panel.show {
  opacity: 1;
  transform: translateY(0);
  transition: opacity var(--transition-med), transform var(--transition-med);
}

.result-title {
  font-size: 0.9rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.result-detail {
  font-size: 0.8rem;
  color: var(--muted);
}

/* スマホフレーム */
.phone-frame {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 9 / 16;
  border-radius: 32px;
  padding: 10px;
  background: radial-gradient(circle at top, #111827, #020617);
  border: 2px solid rgba(148, 163, 184, 0.4);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
  display: flex;
  flex-direction: column;
}

.phone-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 4px 8px;
}

.phone-logo {
  font-weight: 800;
  letter-spacing: 0.12em;
  font-size: 0.8rem;
  text-transform: uppercase;
  color: var(--muted);
}

.phone-icons {
  display: flex;
  gap: 6px;
  font-size: 0.9rem;
}

.notif-icon {
  position: relative;
}

.notif-icon.ping::after {
  content: "";
  position: absolute;
  top: -2px;
  right: -2px;
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 12px rgba(255, 47, 107, 0.8);
  animation: notif-ping 0.7s ease-out;
}

/* スマホ中身 */
.phone-body {
  flex: 1;
  background: #020617;
  border-radius: 24px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* トレンド */
.trend-box {
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), #020617);
  border-radius: 18px;
  padding: 6px 8px;
  border: 1px solid rgba(148, 163, 184, 0.3);
}

.trend-title {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 4px;
}

.trend-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.trend-tag {
  font-size: 0.65rem;
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.4);
  white-space: nowrap;
}

.trend-tag.hot {
  border-color: var(--accent);
  color: #fecaca;
}

/* 投稿プレビュー */
.post-preview {
  background: radial-gradient(circle at top left, #111827, #020617);
  border-radius: 18px;
  padding: 8px;
  border: 1px solid rgba(148, 163, 184, 0.3);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 120px;
}

.post-user {
  display: flex;
  align-items: center;
  gap: 6px;
}

.avatar {
  width: 26px;
  height: 26px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff2f6b, #ff7a3c);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  font-weight: 700;
}

.user-info {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 0.8rem;
  font-weight: 600;
}

.user-meta {
  font-size: 0.65rem;
  color: var(--muted);
}

.post-text {
  font-size: 0.8rem;
  line-height: 1.4;
}

.post-actions {
  display: flex;
  gap: 10px;
  font-size: 0.75rem;
  color: var(--muted);
}

/* コメント欄 */
.comment-box {
  flex: 1;
  background: #020617;
  border-radius: 18px;
  padding: 6px 8px;
  border: 1px solid rgba(31, 41, 55, 0.9);
  display: flex;
  flex-direction: column;
}

.comment-title {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 4px;
}

.comment-list {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
  font-size: 0.7rem;
}

.comment {
  padding: 3px 0;
  color: #e5e7eb;
  opacity: 0.9;
}

.comment.positive {
  color: #bbf7d0;
}

.comment.negative {
  color: #fecaca;
}

.comment.neutral {
  color: #e5e7eb;
}

/* 結果画面 */
#result-screen {
  flex-direction: column;
  gap: 18px;
  text-align: center;
}

.result-header {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.result-label {
  font-size: 0.9rem;
  color: var(--muted);
}

.result-summary {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-top: 4px;
}

.result-stat {
  background: rgba(12, 16, 32, 0.95);
  border-radius: 18px;
  padding: 10px 14px;
  border: 1px solid rgba(148, 163, 184, 0.3);
  min-width: 90px;
}

.world-label {
  margin-top: 10px;
  font-size: 1.2rem;
  font-weight: 700;
}

.world-desc {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--muted);
  max-width: 420px;
  margin-left: auto;
  margin-right: auto;
}

.share-hint {
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--muted);
}

/* アニメーション */
@keyframes notif-ping {
  0% {
    transform: scale(0.4);
    opacity: 0.2;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.pop-number {
  animation: pop-number 0.4s ease-out;
}

@keyframes pop-number {
  0% {
    transform: scale(1.1);
  }
  50% {
    transform: scale(1.25);
  }
  100% {
    transform: scale(1);
  }
}

.burst {
  animation: burst 0.5s ease-out;
}

@keyframes burst {
  0% {
    box-shadow: 0 0 0 0 rgba(255, 47, 107, 0.7);
  }
  100% {
    box-shadow: 0 0 0 18px rgba(255, 47, 107, 0);
  }
}

/* レスポンシブ */
@media (max-width: 800px) {
  #app {
    padding: 8px;
  }

  .main-container {
    flex-direction: column;
  }

  .feed-column {
    order: -1;
  }

  .top-bar {
    font-size: 0.8rem;
  }
}
</style>
</head>

  <div id="app">

    "またバズり狙いかよ。",
    "情報ソースどこ？",
    "炎上しそうなこと言うなｗ",
  ],
  neutral: [
    "なるほどね〜。",
    "たしかに一理ある。",
    "コメント欄カオスで草。",
    "この話題むずいな。",
    "とりあえず様子見。",
  ],
  hype: [
    "これバズるわｗｗｗ",
    "タイムラインこれだらけで草",
    "通知止まらんやろこれ",
    "アルゴに完全に刺さってる",
  ],
  flame: [
    "地獄のコメント欄始まったな",
    "これは燃えるやつ",
    "逆張り合戦スタート",
    "タイムラインが火事で草",
  ],
  conspiracy: [
    "やっぱり裏あるよな…",
    "これ前から言われてたよ",
    "気づいてる人少なすぎる",
    "真実に近づきすぎてる",
  ],
  meme: [
    "ネタにするなｗｗｗ",
    "スタンプ職人湧いてて草",
    "切り抜き待ってます",
    "音源化されそう",
  ],
};

// ----------------------
// 状態
// ----------------------
let state;

function initState() {
  state = {
    turn: 1,
    followers: 120,
    trust: 50,
    heat: 0,
    division: 10,
    conspiracy: 5,
    humor: 10,
    // おすすめアルゴリズム傾向
    algo: {
      calm: 1,
      hype: 1,
      flame: 1,
      conspiracy: 1,
      meme: 1,
    },
    currentNews: "",
    lastPostType: null,
  };
}

// ----------------------
// ユーティリティ
// ----------------------
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function pickRandom(arr) {
  return arr[randInt(0, arr.length - 1)];
}

// ----------------------
// DOM取得
// ----------------------
const titleScreen = document.getElementById("title-screen");
const gameScreen = document.getElementById("game-screen");
const resultScreen = document.getElementById("result-screen");

const startBtn = document.getElementById("start-btn");
const replayBtn = document.getElementById("replay-btn");

const followersEl = document.getElementById("followers");
const trustEl = document.getElementById("trust");
const heatEl = document.getElementById("heat");
const turnEl = document.getElementById("turn");

const newsTextEl = document.getElementById("news-text");
const postButtonsEl = document.getElementById("post-buttons");
const resultPanelEl = document.getElementById("result-panel");
const resultTitleEl = document.getElementById("result-title");
const resultDetailEl = document.getElementById("result-detail");

const trendTagsEl = document.getElementById("trend-tags");
const postStyleLabelEl = document.getElementById("post-style-label");
const postPreviewTextEl = document.getElementById("post-preview-text");
const likeCountEl = document.getElementById("like-count");
const repostCountEl = document.getElementById("repost-count");
const commentCountEl = document.getElementById("comment-count");
const commentListEl = document.getElementById("comment-list");
const notifIconEl = document.getElementById("notif-icon");

const finalFollowersEl = document.getElementById("final-followers");
const finalTrustEl = document.getElementById("final-trust");
const finalHeatEl = document.getElementById("final-heat");
const worldLabelEl = document.getElementById("world-label");
const worldDescEl = document.getElementById("world-desc");

const seBuzz = document.getElementById("se-buzz");
const seFire = document.getElementById("se-fire");
const seNotif = document.getElementById("se-notif");

// ----------------------
// 画面切り替え
// ----------------------
function showScreen(screen) {
  [titleScreen, gameScreen, resultScreen].forEach((s) =>
    s.classList.remove("active")
  );
  screen.classList.add("active");
}

// ----------------------
// UI更新
// ----------------------
function updateStatsUI() {
  followersEl.textContent = Math.round(state.followers).toLocaleString();
  trustEl.textContent = Math.round(state.trust);
  heatEl.textContent = Math.round(state.heat);
  turnEl.textContent = state.turn;

  [followersEl, trustEl, heatEl].forEach((el) => {
    el.classList.remove("pop-number");
    void el.offsetWidth;
    el.classList.add("pop-number");
  });
}

function updateNews() {
  state.currentNews = pickRandom(newsPool);
  newsTextEl.textContent = state.currentNews;
}

function buildPostButtons() {
  postButtonsEl.innerHTML = "";
  postTypes.forEach((pt) => {
    const btn = document.createElement("button");
    btn.className = "post-btn";
    btn.innerHTML = `
      <div class="post-btn-main">${pt.label}</div>
      <div class="post-btn-sub">${pt.sub}</div>
    `;
    btn.addEventListener("click", () => handlePost(pt));
    postButtonsEl.appendChild(btn);
  });
}

function updateTrends() {
  trendTagsEl.innerHTML = "";

  const scores = [
    { key: "calm", label: "#冷静に話そう" },
    { key: "hype", label: "#もう終わりだろ" },
    { key: "flame", label: "#大炎上中" },
    { key: "conspiracy", label: "#裏で繋がってる説" },
    { key: "meme", label: "#とりあえずネタにする" },
  ];

  scores.forEach((s) => {
    let base = 1;
    if (s.key === "calm") base = state.trust;
    if (s.key === "hype") base = state.heat + state.division;
    if (s.key === "flame") base = state.heat * 1.2;
    if (s.key === "conspiracy") base = state.conspiracy * 1.4;
    if (s.key === "meme") base = state.humor * 1.3;

    s.score = base * state.algo[s.key];
  });

  scores.sort((a, b) => b.score - a.score);

  scores.slice(0, 4).forEach((s, i) => {
    const tag = document.createElement("span");
    tag.className = "trend-tag";
    if (i === 0 || s.score > 60) tag.classList.add("hot");
    tag.textContent = s.label;
    trendTagsEl.appendChild(tag);
  });
}

function pushComments(postType, stats) {
  const list = [];

  const { followersGain, heatGain, trustGain, divisionGain, conspiracyGain } =
    stats;

  if (followersGain > 200) {
    list.push(pickRandom(commentTemplates.hype));
  }
  if (heatGain > 8 || state.heat > 40) {
    list.push(pickRandom(commentTemplates.flame));
  }
  if (conspiracyGain > 6 || state.conspiracy > 40) {
    list.push(pickRandom(commentTemplates.conspiracy));
  }
  if (postType.id === "meme" || state.humor > 40) {
    list.push(pickRandom(commentTemplates.meme));
  }

  if (trustGain > 3) {
    list.push(pickRandom(commentTemplates.positive));
  } else if (trustGain < -4) {
    list.push(pickRandom(commentTemplates.negative));
  } else {
    list.push(pickRandom(commentTemplates.neutral));
  }

  while (list.length < 4) {
    list.push(pickRandom(commentTemplates.neutral));
  }

  const existing = Array.from(commentListEl.children).slice(0, 20);
  commentListEl.innerHTML = "";
  existing.forEach((el) => commentListEl.appendChild(el));

  list.forEach((text) => {
    const div = document.createElement("div");
    div.className = "comment neutral";
    if (text.includes("正論") || text.includes("ありがたい")) {
      div.classList.add("positive");
    } else if (text.includes("危ない") || text.includes("燃える")) {
      div.classList.add("negative");
    }
    div.textContent = text;
    commentListEl.appendChild(div);
  });
}

function playSE(audioEl) {
  if (!audioEl) return;
  audioEl.currentTime = 0;
  audioEl.play().catch(() => {});
}

// ----------------------
// 投稿処理
// ----------------------
function handlePost(postType) {
  state.lastPostType = postType.id;

  const eff = postType.effects;
  const followersGain = randInt(eff.followers[0], eff.followers[1]);
  const trustGain = randInt(eff.trust[0], eff.trust[1]);
  const heatGain = randInt(eff.heat[0], eff.heat[1]);
  const divisionGain = randInt(eff.division[0], eff.division[1]);
  const conspiracyGain = randInt(eff.conspiracy[0], eff.conspiracy[1]);
  const humorGain = randInt(eff.humor[0], eff.humor[1]);

  state.followers = Math.max(0, state.followers + followersGain);
  state.trust = clamp(state.trust + trustGain, 0, 100);
  state.heat = clamp(state.heat + heatGain, 0, 100);
  state.division = clamp(state.division + divisionGain, 0, 100);
  state.conspiracy = clamp(state.conspiracy + conspiracyGain, 0, 100);
  state.humor = clamp(state.humor + humorGain, 0, 100);

  // アルゴリズム傾向更新
  Object.keys(state.algo).forEach((k) => {
    state.algo[k] *= 0.98;
  });
  Object.entries(postType.weight).forEach(([k, v]) => {
    state.algo[k] *= v;
  });

  // プレビュー更新
  postStyleLabelEl.textContent = `投稿スタイル：${postType.label}`;
  postPreviewTextEl.textContent = postType.preview;

  const likeBase = followersGain * (1 + state.heat / 120);
  const repostBase = followersGain * (0.3 + state.division / 200);
  const commentBase = followersGain * (0.2 + state.conspiracy / 250);

  const likes = Math.round(likeBase);
  const reposts = Math.round(repostBase);
  const comments = Math.round(commentBase);

  likeCountEl.textContent = likes.toLocaleString();
  repostCountEl.textContent = reposts.toLocaleString();
  commentCountEl.textContent = comments.toLocaleString();

  [likeCountEl, repostCountEl, commentCountEl].forEach((el) => {
    el.classList.remove("pop-number");
    void el.offsetWidth;
    el.classList.add("pop-number");
  });

  // 結果テキスト
  let title;
  if (likes > 800) {
    title = "超バズり！";
  } else if (likes > 400) {
    title = "バズった！";
  } else if (likes > 150) {
    title = "そこそこ伸びた";
  } else {
    title = "静かなタイムライン";
  }

  if (state.heat > 60 || heatGain > 12) {
    title += "（炎上気味）";
  }

  const detailParts = [];
  detailParts.push(`フォロワー +${followersGain.toLocaleString()}`);
  if (trustGain !== 0) {
    detailParts.push(
      `信頼度 ${trustGain > 0 ? "+" : ""}${trustGain.toFixed(0)}`
    );
  }
  if (heatGain !== 0) {
    detailParts.push(`炎上度 ${heatGain > 0 ? "+" : ""}${heatGain.toFixed(0)}`);
  }

  resultTitleEl.textContent = title;
  resultDetailEl.textContent = detailParts.join(" / ");

  resultPanelEl.classList.remove("hidden");
  void resultPanelEl.offsetWidth;
  resultPanelEl.classList.add("show");

  // コメント
  pushComments(postType, {
    followersGain,
    trustGain,
    heatGain,
    divisionGain,
    conspiracyGain,
  });

  // 通知演出
  notifIconEl.classList.remove("ping");
  void notifIconEl.offsetWidth;
  notifIconEl.classList.add("ping");

  const phoneFrame = document.querySelector(".phone-frame");
  phoneFrame.classList.remove("burst");
  void phoneFrame.offsetWidth;
  phoneFrame.classList.add("burst");

  // SE
  if (heatGain > 10 || state.heat > 60) {
    playSE(seFire);
  } else {
    playSE(seBuzz);
  }
  playSE(seNotif);

  updateStatsUI();
  updateTrends();

  // 次ターンへ
  setTimeout(() => {
    nextTurn();
  }, 900);
}

function nextTurn() {
  if (state.turn >= MAX_TURNS) {
    endGame();
    return;
  }
  state.turn += 1;
  updateStatsUI();
  updateNews();
}

// ----------------------
// 結果判定
// ----------------------
function endGame() {
  showScreen(resultScreen);

  finalFollowersEl.textContent = Math.round(state.followers).toLocaleString();
  finalTrustEl.textContent = Math.round(state.trust);
  finalHeatEl.textContent = Math.round(state.heat);

  let label = "";
  let desc = "";

  if (state.conspiracy > 60 && state.heat > 40) {
    label = "陰謀論タイムライン";
    desc =
      "裏話と“真実”っぽい話で埋め尽くされた世界。フォロワーは増えたけど、もう何が本当かは誰も気にしてない。";
  } else if (state.heat > 70 && state.division > 60) {
    label = "炎上バトルSNS";
    desc =
      "常に誰かが燃えている世界。あなたの通知も止まらない。でも、落ち着いた話はどこかに消えた。";
  } else if (state.humor > 60 && state.trust < 40) {
    label = "全部ネタ化SNS";
    desc =
      "どんなニュースもネタにされて一瞬で流れていく世界。重い話も軽い話も、全部“おもしろいかどうか”だけ。";
  } else if (state.trust > 70 && state.heat < 40 && state.division < 40) {
    label = "そこそこ平和なSNS";
    desc =
      "ちゃんと話せる人も多いし、たまにバズもある。ギリギリ心が壊れないくらいの、ちょうどいいカオス。";
  } else if (state.division > 60) {
    label = "分断されたタイムライン";
    desc =
      "同じニュースなのに、見えている世界が全然違う人たちが増えた。あなたの投稿も、その一部になっている。";
  } else {
    label = "いつものSNS";
    desc =
      "バズも炎上も、陰謀もネタも、全部ちょっとずつ混ざった世界。今日も誰かが「もう終わりだろこれ」と言いながら、タイムラインをスクロールしている。";
  }

  worldLabelEl.textContent = label;
  worldDescEl.textContent = desc;
}

// ----------------------
// ゲーム開始
// ----------------------
function startGame() {
  initState();
  showScreen(gameScreen);
  updateStatsUI();
  updateNews();
  buildPostButtons();
  updateTrends();
  resultPanelEl.classList.add("hidden");
}

// ----------------------
// イベント
// ----------------------
startBtn.addEventListener("click", () => {
  startGame();
});

replayBtn.addEventListener("click", () => {
  startGame();
});

// 初期表示
showScreen(titleScreen);
</script>
</body>
</html>
